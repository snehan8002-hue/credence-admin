<!DOCTYPE html>
<html><head><title>Reset Password</title>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5} .box{background:white;padding:30px;border-radius:10px;box-shadow:0 2px 10px #ccc;width:300px} input{width:100%;padding:10px;margin:10px 0} button{width:100%;padding:10px;background:black;color:white;border:none;border-radius:5px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<div class="box"><h3>Set New Password</h3><input id="pw" type="password" placeholder="New password"><button onclick="reset()">Update Password</button><p id="msg"></p></div>
<script>
const sb = supabase.createClient('YOUR_SUPABASE_URL','YOUR_ANON_KEY');
async function reset(){
  const pw=document.getElementById('pw').value;
  const {error}=await sb.auth.updateUser({password:pw});
  document.getElementById('msg').innerText= error ? error.message : 'Password updated! Go to login.';
  if(!error) setTimeout(()=>location.href='./index.html',2000);
}
sb.auth.onAuthStateChange((e,s)=>{ if(e==='PASSWORD_RECOVERY') document.getElementById('msg').innerText='Enter new password above'; });
</script></body></html>
