<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Set New Password</title><style>body{font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f8f6;margin:0;color:#123126}.box{background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001;width:90%;max-width:380px}input{width:100%;padding:13px;margin:9px 0;border:1px solid #d5e1db;border-radius:10px;box-sizing:border-box;font:inherit}button{width:100%;padding:13px;background:#08783f;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer}#msg{margin-top:14px;text-align:center;font-size:14px;line-height:1.45;color:#66756e}.error{color:#a33!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="box"><h2 style="margin:0 0 8px">Set New Password</h2><p style="color:#66756e;font-size:14px">Choose a new password for your CREDENCE account.</p><form id="resetForm"><input id="pw" type="password" autocomplete="new-password" minlength="6" placeholder="New password" required><input id="pw2" type="password" autocomplete="new-password" minlength="6" placeholder="Confirm new password" required><button id="resetBtn" type="submit">Update Password</button></form><p id="msg">Verifying recovery link…</p></div><script>const sb=supabase.createClient('https://tasoycsbzceohgjxizdp.supabase.co','sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl');const msg=t=>document.getElementById('msg').textContent=t;let ready=false;sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){ready=!!session;msg(ready?'Recovery verified. Enter your new password.':'Verifying recovery link…')}});(async()=>{const {data,error}=await sb.auth.getSession();if(error||!data.session){msg('This recovery link is invalid or expired. Please request a new password-reset email.');document.getElementById('resetBtn').disabled=true;return}ready=true;msg('Recovery verified. Enter your new password.')})();document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();if(!ready)return msg('Please open a fresh password-reset link first.');const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a.length<6)return msg('Password must be at least 6 characters.');if(a!==b)return msg('Passwords do not match.');const btn=document.getElementById('resetBtn');btn.disabled=true;msg('Updating password…');const {error}=await sb.auth.updateUser({password:a});if(error){btn.disabled=false;document.getElementById('msg').className='error';msg(error.message);return}msg('Password updated successfully. Redirecting to CREDENCE…');await sb.auth.signOut();setTimeout(()=>location.href='./index.html',1200)});</script></body></html>
