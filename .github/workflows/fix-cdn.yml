name: Fix Credence CDN
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Supabase CDN and add visible fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("https://esm.sh/@supabase/supabase-js@2", "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm")
          s=s.replace('<div id="app"></div><script type="module">','<div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui"><div style="text-align:center"><div style="font-size:42px;font-weight:900;color:#08783f">CREDENCE</div><div>Loading…</div></div></div></div><script type="module">')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Supabase CDN blank page' || exit 0
          git push
