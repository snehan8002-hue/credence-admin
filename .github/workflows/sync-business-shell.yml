name: Sync CREDENCE business shell

on:
  push:
    branches: [main]
    paths:
      - 'business-shell-v3.source.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install business shell
        run: cp business-shell-v3.source.js business-login-final.js
      - name: Commit business shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add business-login-final.js
          if git diff --cached --quiet; then
            echo 'No business shell changes.'
            exit 0
          fi
          git commit -m 'Build CREDENCE business-class admin workspace'
          git push
