name: Deploy Unified CREDENCE App

on:
  push:
    branches: [credence-admin-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify complete unified app
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f auth-fix.js

          test -f student-courses.html
          test -f student-videos.html
          test -f student-quizzes.html
          test -f student-tests.html
          test -f student-fees.html

          test -f auth.html

          test -f admin.html
          test -f admin-auth.js
          test -f admin-dashboard.html
          test -f admin-courses.html
          test -f admin-media.html
          test -f admin-quizzes.html
          test -f admin-certificates.html
          test -f admin-communications.html
          test -f admin-support.html

          test -f reset-password.html

          touch .nojekyll

          echo "Verified unified CREDENCE Student + Admin application"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Force deployment of the latest CREDENCE fixes