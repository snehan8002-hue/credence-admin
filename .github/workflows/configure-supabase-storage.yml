name: Configure Supabase Storage copy

on:
  push:
    branches:
      - supabase-storage

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure Supabase Storage in the separate copy
        env:
          SUPABASE_URL: https://tasoycsbzceohgjxizdp.supabase.co
          SUPABASE_KEY: sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl
          BUCKET: credence-files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'const SUPABASE_URL = "[^"]*";', 'const SUPABASE_URL = "https://tasoycsbzceohgjxizdp.supabase.co";', s, count=1)
          s = re.sub(r'const SUPABASE_PUBLISHABLE_KEY = "[^"]*";', 'const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl";', s, count=1)
          marker = 'const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl";'
          if 'const SUPABASE_BUCKET = "credence-files";' not in s:
              s = s.replace(marker, marker + '\nconst SUPABASE_BUCKET = "credence-files";', 1)
          s = s.replace('SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, signInWithEmailAndPassword', 'SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_BUCKET, signInWithEmailAndPassword', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/configure-supabase-storage.yml

      - name: Commit configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/configure-supabase-storage.yml
          git diff --cached --quiet || git commit -m "Configure separate Supabase Storage copy"
          git push
