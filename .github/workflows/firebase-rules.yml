name: Deploy CREDENCE Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Validate Firebase configuration
        run: |
          set -euo pipefail
          test -f firebase.json
          test -f firestore.rules
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('firebase.json OK')"
          echo "Target Firebase project: credence-76953"
          echo "Firestore rules source: firestore.rules"
          firebase --version

      - name: Deploy Firestore Security Rules
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            echo "Deploying Firestore rules with FIREBASE_SERVICE_ACCOUNT..."
            if firebase deploy --only firestore:rules --project credence-76953 --non-interactive; then
              exit 0
            fi
            if [ -n "${FIREBASE_TOKEN:-}" ]; then
              echo "Service-account deployment failed; retrying with FIREBASE_TOKEN..."
              unset GOOGLE_APPLICATION_CREDENTIALS
              firebase deploy --only firestore:rules --project credence-76953 --non-interactive --token "$FIREBASE_TOKEN"
            else
              echo "ERROR: FIREBASE_SERVICE_ACCOUNT deployment failed and no FIREBASE_TOKEN fallback is configured."
              exit 1
            fi
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying Firestore rules with FIREBASE_TOKEN..."
            firebase deploy --only firestore:rules --project credence-76953 --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "ERROR: No Firebase credential configured."
            echo "Add FIREBASE_SERVICE_ACCOUNT (recommended) or FIREBASE_TOKEN to GitHub repository Actions secrets."
            exit 1
          fi

      - name: Deployment complete
        run: echo "CREDENCE Firestore rules deployment completed for credence-76953."