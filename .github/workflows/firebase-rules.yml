name: Deploy CREDENCE Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase configuration
        run: |
          test -f firebase.json
          test -f firestore.rules
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('firebase.json OK')"

      - name: Deploy Firestore rules
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            echo "Deploying Firestore rules using FIREBASE_SERVICE_ACCOUNT..."
            firebase deploy --only firestore:rules --project credence-76953 --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying Firestore rules using FIREBASE_TOKEN..."
            firebase deploy --only firestore:rules --project credence-76953 --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "ERROR: No Firebase credential configured. Add FIREBASE_SERVICE_ACCOUNT (recommended) or FIREBASE_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
