name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove conflicting student scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          version='20260907-student-clean-5'
          # Keep only the stable enhancement stack. Remove all experimental student handlers
          # that were competing for the same Edit button.
          text=re.sub(r'<script(?: defer)? src="student-(?:controls-fix|management-override|editor-fix)(?:\?v=[^"]+)?"></script>\s*', '', text)
          for name in ['enhancements.js','enhancements-fixes.js','auth-hardening.js']:
              tag=f'<script defer src="{name}?v={version}"></script>'
              pattern=r'<script(?: defer)? src="'+re.escape(name)+r'(?:\?v=[^"]+)?"></script>'
              text,n=re.subn(pattern,tag,text)
              if not n and tag not in text:
                  text=text.replace('</head>',tag+'\n</head>',1)
          p.write_text(text,encoding='utf-8')
          print('Removed conflicting student handlers; stable student management is now authoritative.')
          PY
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove conflicting student handlers'
          git push
