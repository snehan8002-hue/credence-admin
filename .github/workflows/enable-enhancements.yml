name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable CREDENCE modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          version='20260907-teacher-home-6'
          for name in ['enhancements.js','enhancements-fixes.js','auth-hardening.js','ui-final-fixes.js','student-final-management.js','business-modules.js','test-management.js','results-management.js','notes-management.js','bottom-nav-final.js','teacher-nav-fix.js','teacher-home-final.js','teacher-final-fix.js']:
              tag=f'<script defer src="{name}?v={version}"></script>'
              pattern=r'<script(?: defer)? src="'+re.escape(name)+r'(?:\?v=[^"]+)?"></script>'
              text,n=re.subn(pattern,tag,text)
              if not n and tag not in text:
                  text=text.replace('</head>',tag+'\n</head>',1)
          for name in ['student-controls-fix.js','student-management-override.js','student-editor-fix.js','student-navigation-fix.js']:
              text=re.sub(r'<script(?: defer)? src="'+re.escape(name)+r'(?:\?v=[^"]+)?"></script>\s*','',text)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump CREDENCE Teacher UI cache version'
          git push
