name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable CREDENCE modules and force final UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          version='20260908-mobile-fit-20'
          names=['performance-stability-fix.js','enhancements.js','enhancements-fixes.js','auth-hardening.js','ui-final-fixes.js','student-final-management.js','business-modules.js','test-management.js','results-management.js','notes-management.js','bottom-nav-final.js']
          extras=['teacher-nav-fix.js','teacher-home-final.js','teacher-ui-final.js','teacher-final-fix.js','teacher-unified-final.js','dashboard-minimal-menu.js','dashboard-ui-repair.js','reference-mobile-v3.js','business-login-final.js']
          for name in names + extras:
              text=re.sub(r'<script[^>]+src=["\']'+re.escape(name)+r'(?:\?v=[^"\']+)?["\'][^>]*></script>\s*','',text,flags=re.I)
          tags='\n'.join(f'<script defer src="{name}?v={version}"></script>' for name in names)
          tags += f'\n<script defer src="teacher-unified-final.js?v={version}"></script>'
          tags += f'\n<script defer src="dashboard-minimal-menu.js?v={version}"></script>'
          tags += f'\n<script defer src="dashboard-ui-repair.js?v={version}"></script>'
          tags += f'\n<script defer src="reference-mobile-v3.js?v={version}"></script>'
          tags += f'\n<script defer src="business-login-final.js?v={version}"></script>'
          text=text.replace('</head>',tags+'\n</head>',1)
          text=re.sub(r'\n\s*<style id="credence-dashboard-final-style">.*?</style>\s*<script>\(function\(\)\{.*?\}\)\(\);</script>\s*','\n',text,flags=re.S|re.I)
          text=re.sub(r'\n\s*<div class="section"><h2>Quick Actions</h2></div>\s*\n\s*<div class="card actions">.*?</div>\s*(?=</section>)','\n',text,count=1,flags=re.S|re.I)
          text=text.replace('<div><div class="section"><h2>Today\'s Live Classes</h2><button class="btn" onclick="openClass()">+ Add Class</button></div>','<div><div class="section"><h2>Today\'s Live Classes</h2></div>',1)
          fix='''(function(){\n'use strict';\nfunction install(){\n if(document.getElementById('credenceBusinessLoginStyle'))return;\n const s=document.createElement('style');s.id='credenceBusinessLoginStyle';s.textContent=`\nhtml,body{max-width:100%;overflow-x:hidden!important}\nbody.ceBusinessLogin .mobilebar{display:none!important}\n#adminGate{z-index:999999!important}\n.ceBizLogin{min-height:100dvh;width:100%;position:relative;overflow:hidden;background:#f5f9f6;color:#17382b;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:28px 18px 24px}\n.ceBizLogin:before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(135deg,#063c28 0%,#08783f 58%,#11a65b 100%);border-radius:0 0 42px 42px}\n.ceBizOrb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}.ceBizOrb.a{width:280px;height:280px;right:-120px;top:-130px}.ceBizOrb.b{width:170px;height:170px;left:-90px;top:150px}\n.ceBizWrap{position:relative;z-index:2;width:min(430px,100%);display:flex;flex-direction:column;align-items:center}\n.ceBizBrand{color:#fff;text-align:center;margin:20px 0 28px}.ceBizLogo{width:58px;height:58px;border-radius:17px;margin:0 auto 12px;display:grid;place-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);font-size:30px;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.16)}.ceBizBrand h2{margin:0;font-size:25px;letter-spacing:3px;line-height:1;font-weight:900}.ceBizBrand p{margin:8px 0 0;font-size:8px;letter-spacing:2px;font-weight:800;opacity:.82}\n.ceBizCard{width:100%;background:#fff;border:1px solid #e0eae4;border-radius:24px;padding:26px 22px 22px;box-shadow:0 22px 55px rgba(15,72,46,.17)}.ceBizTag{display:inline-flex;padding:6px 9px;border-radius:99px;background:#e8f7ee;color:#08783f;font-size:9px;font-weight:900;letter-spacing:1px}.ceBizCard h1{margin:14px 0 6px;font-size:28px;letter-spacing:-.7px}.ceBizIntro{margin:0 0 21px;color:#718078;font-size:12px;line-height:1.5}.ceBizField{margin-top:14px}.ceBizField label{display:block;margin:0 0 7px;font-size:11px;font-weight:900;color:#29483b}.ceBizInput{height:51px;display:flex;align-items:center;gap:10px;padding:0 13px;border:1.5px solid #dce7e1;border-radius:12px;background:#fbfdfc}.ceBizInput:focus-within{border-color:#0b9551;box-shadow:0 0 0 4px rgba(11,149,81,.08);background:#fff}.ceBizInput .i{width:19px;text-align:center;color:#0a8a4a;font-size:13px}.ceBizInput input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#17382b;font-size:14px}.ceBizInput input::placeholder{color:#a0aaa5}.ceBizButton{width:100%;height:52px;margin-top:21px;border:0;border-radius:13px;background:linear-gradient(135deg,#08783f,#0ca653);color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 9px 20px rgba(8,120,63,.22)}.ceBizButton:disabled{opacity:.7;cursor:wait}.ceBizError{min-height:18px;margin-top:9px;color:#d94747;font-size:11px;line-height:1.4}.ceBizSecure{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;color:#87938d;font-size:9px;font-weight:700}.ceBizFooter{margin-top:17px;color:#8a9690;font-size:9px;font-weight:700;text-align:center}\n@media(min-width:651px){.ceBizLogin{padding-top:55px}.ceBizBrand{margin-bottom:34px}.ceBizCard{padding:30px}.ceBizCard h1{font-size:30px}}\n@media(max-width:650px){.ceBizLogin{padding:20px 16px 18px}.ceBizLogin:before{height:42%;border-radius:0 0 32px 32px}.ceBizBrand{margin:14px 0 23px}.ceBizLogo{width:54px;height:54px;font-size:28px;margin-bottom:10px}.ceBizBrand h2{font-size:23px;letter-spacing:2.6px}.ceBizBrand p{font-size:7px;letter-spacing:1.6px}.ceBizCard{border-radius:21px;padding:22px 18px 19px}.ceBizCard h1{font-size:25px}.ceBizIntro{font-size:11px;margin-bottom:18px}.ceBizInput{height:49px}.ceBizButton{height:51px}.ceBizFooter{font-size:8px;margin-top:12px}}\n`;document.head.appendChild(s);\n}\nfunction loginVisible(g){return g&&getComputedStyle(g).display!=='none'&&g.style.display!=='none'}\nfunction normalizeNav(){const bar=document.querySelector('#appShell .mobilebar,.mobilebar');if(!bar)return;const seen=new Set();[...bar.querySelectorAll('button')].forEach(b=>{const label=(b.querySelector('small')?.textContent||b.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();if(seen.has(label))b.remove();else seen.add(label)});bar.style.overflow='hidden';bar.style.touchAction='manipulation'}\nfunction setup(){install();const g=document.getElementById('adminGate');if(!g)return;const visible=loginVisible(g);document.body.classList.toggle('ceBusinessLogin',visible);if(visible&&!g.dataset.ceBusinessReady){g.dataset.ceBusinessReady='1';g.innerHTML='<div class="ceBizLogin"><div class="ceBizOrb a"></div><div class="ceBizOrb b"></div><div class="ceBizWrap"><div class="ceBizBrand"><div class="ceBizLogo">C</div><h2>CREDENCE</h2><p>SMART EDUCATION ADMIN CONSOLE</p></div><div class="ceBizCard"><span class="ceBizTag">ADMINISTRATOR ACCESS</span><h1>Welcome back</h1><p class="ceBizIntro">Sign in to securely manage your CREDENCE education platform.</p><div class="ceBizField"><label for="adminEmailInput">Admin Email</label><div class="ceBizInput"><span class="i">✉</span><input id="adminEmailInput" type="email" placeholder="Enter your admin email" autocomplete="username"></div></div><div class="ceBizField"><label for="adminPasswordInput">Password</label><div class="ceBizInput"><span class="i">●</span><input id="adminPasswordInput" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div><button type="button" class="btn ceBizButton" onclick="adminLogin()"><span>Login as Admin</span><span>→</span></button><div id="loginError" class="ceBizError"></div><div class="ceBizSecure"><span>🔒</span><span>Secure access • Authorized administrators only</span></div></div><div class="ceBizFooter">CREDENCE • Education Management Platform</div></div></div>'}\nif(!visible)normalizeNav()}\nsetup();let n=0;const t=setInterval(()=>{setup();if(++n>120)clearInterval(t)},250);new MutationObserver(setup).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});\n})();\n'''
          Path('business-login-final.js').write_text(fix,encoding='utf-8')
          Path('app-v2.html').write_text(text,encoding='utf-8')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html app-v2.html business-login-final.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions@users.noreply.github.com'
          git add index.html app-v2.html business-login-final.js
          git commit -m 'Publish final business class login and mobile nav'
          git push
