name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable CREDENCE modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          version='20260907-dashboard-menu-14'
          names=['performance-stability-fix.js','enhancements.js','enhancements-fixes.js','auth-hardening.js','ui-final-fixes.js','student-final-management.js','business-modules.js','test-management.js','results-management.js','notes-management.js','bottom-nav-final.js']
          for name in names + ['teacher-nav-fix.js','teacher-home-final.js','teacher-ui-final.js','teacher-final-fix.js','teacher-unified-final.js','dashboard-minimal-menu.js']:
              text=re.sub(r'<script[^>]+src=["\']'+re.escape(name)+r'(?:\?v=[^"\']+)?["\'][^>]*></script>\s*','',text,flags=re.I)
          tags='\n'.join(f'<script defer src="{name}?v={version}"></script>' for name in names)
          tags += f'\n<script defer src="teacher-unified-final.js?v={version}"></script>'
          tags += f'\n<script defer src="dashboard-minimal-menu.js?v={version}"></script>'
          text=text.replace('</head>',tags+'\n</head>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump CREDENCE dashboard asset version'
          git push
