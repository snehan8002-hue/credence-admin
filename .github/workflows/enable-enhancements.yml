name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load admin enhancement scripts with cache busting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          version = '20260906-3'
          changed = False
          for name in ['enhancements.js','enhancements-fixes.js','auth-hardening.js']:
              tag = f'<script src="{name}?v={version}"></script>'
              pattern = r'<script src="' + re.escape(name) + r'(?:\?v=[^"]+)?"></script>'
              new, n = re.subn(pattern, tag, text)
              if n:
                  text = new
                  changed = True
              elif tag not in text:
                  text = text.replace('</head>', tag + '\n</head>', 1)
                  changed = True
          p.write_text(text, encoding='utf-8')
          print('CREDENCE enhancement scripts cache-busted.')
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Cache bust CREDENCE admin scripts'
          git push
