name: Enable CREDENCE Admin Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable CREDENCE modules and force dashboard UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          version='20260908-mobile-fit-19'
          names=['performance-stability-fix.js','enhancements.js','enhancements-fixes.js','auth-hardening.js','ui-final-fixes.js','student-final-management.js','business-modules.js','test-management.js','results-management.js','notes-management.js','bottom-nav-final.js']
          extras=['teacher-nav-fix.js','teacher-home-final.js','teacher-ui-final.js','teacher-final-fix.js','teacher-unified-final.js','dashboard-minimal-menu.js','dashboard-ui-repair.js','reference-mobile-v3.js']
          for name in names + extras:
              text=re.sub(r'<script[^>]+src=["\']'+re.escape(name)+r'(?:\?v=[^"\']+)?["\'][^>]*></script>\s*','',text,flags=re.I)
          tags='\n'.join(f'<script defer src="{name}?v={version}"></script>' for name in names)
          tags += f'\n<script defer src="teacher-unified-final.js?v={version}"></script>'
          tags += f'\n<script defer src="dashboard-minimal-menu.js?v={version}"></script>'
          tags += f'\n<script defer src="dashboard-ui-repair.js?v={version}"></script>'
          tags += f'\n<script defer src="reference-mobile-v3.js?v={version}"></script>'
          text=text.replace('</head>',tags+'\n</head>',1)
          text=re.sub(r'\n\s*<style id="credence-dashboard-final-style">.*?</style>\s*<script>\(function\(\)\{.*?\}\)\(\);</script>\s*','\n',text,flags=re.S|re.I)
          text=re.sub(r'\n\s*<div class="section"><h2>Quick Actions</h2></div>\s*\n\s*<div class="card actions">.*?</div>\s*(?=</section>)','\n',text,count=1,flags=re.S|re.I)
          text=text.replace('<div><div class="section"><h2>Today\'s Live Classes</h2><button class="btn" onclick="openClass()">+ Add Class</button></div>','<div><div class="section"><h2>Today\'s Live Classes</h2></div>',1)
          p.write_text(text,encoding='utf-8')
          Path('app-v2.html').write_text(text,encoding='utf-8')
          PY
      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html app-v2.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions@users.noreply.github.com'
          git add index.html app-v2.html
          git commit -m 'Publish fresh uncached CREDENCE admin app'
          git push
