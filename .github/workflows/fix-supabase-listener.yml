name: Fix Credence startup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Supabase startup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          changed = False
          old_cdn = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
          new_cdn = 'https://esm.sh/@supabase/supabase-js@2'
          if old_cdn in s:
              s = s.replace(old_cdn, new_cdn, 1)
              changed = True
          listener = r"SB\.auth\.onAuthStateChange\(\(_,session\)=>\{s\.session=session;session\?load\(\):auth\(\)\}\);"
          ns, count = re.subn(listener, '', s)
          if count:
              s = ns
              changed = True
          marker = '</script></body></html>'
          if marker in s:
              before = s.rsplit(marker, 1)[0]
              before = re.sub(r'(?:load\(\);\s*)+$', '', before)
              s = before + 'load();\n' + marker
          p.write_text(s)
          print('changed:', changed)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Credence final auth startup'
          git push
