name: Refresh CREDENCE UI Cache

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump UI asset version
        run: sed -i 's/20260907-dashboard-menu-17/20260908-login-fix-22/g; s/20260908-mobile-fit-20/20260908-login-fix-22/g; s/20260908-login-fix-21/20260908-login-fix-22/g' index.html
      - name: Commit cache-busting version
        run: |
          if git diff --quiet; then
            echo 'No cache-busting change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh UI assets for admin auth hardening [skip ci]'
          git push
