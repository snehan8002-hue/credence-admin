name: Force CREDENCE Dashboard UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply dashboard UI directly to index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = re.sub(
              r'\n\s*<div class="section"><h2>Quick Actions</h2></div>\s*\n\s*<div class="card actions">.*?</div>\s*(?=</section>)',
              '\n', text, count=1, flags=re.S | re.I
          )

          text = text.replace(
              '<div><div class="section"><h2>Today\'s Live Classes</h2><button class="btn" onclick="openClass()">+ Add Class</button></div>',
              '<div><div class="section"><h2>Today\'s Live Classes</h2></div>', 1
          )

          marker = 'CREDENCE_REFERENCE_DASHBOARD_V2'
          if marker not in text:
              patch = r'''
<!-- CREDENCE_REFERENCE_DASHBOARD_V2 -->
<script defer src="reference-dashboard-ui.js?v=20260908-reference-v2"></script>
'''
              text=text.replace('</head>',patch+'\n</head>',1)

          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit dashboard patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply reference-style dashboard UI'
          git push
