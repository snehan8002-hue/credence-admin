<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Admin</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f8f5}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="index.html?fresh=2026090805" title="CREDENCE Admin"></iframe>
<script>
(function(){
 const frame=document.getElementById('app');let timer=null;
 async function patch(){
  const w=frame.contentWindow,d=frame.contentDocument;if(!d)return;
  const s=d.getElementById('ceEmergencyLoginFix')||d.createElement('style');s.id='ceEmergencyLoginFix';s.textContent='@media(max-width:650px){body .mobilebar{display:none!important}body.ceBusinessLogin .mobilebar{display:none!important}body:has(#adminGate[style*="display: flex"]) .mobilebar{display:none!important}}';if(!s.parentNode)d.head.appendChild(s);
  const gate=d.getElementById('adminGate'),shell=d.getElementById('appShell');
  const loggedIn=gate&&getComputedStyle(gate).display==='none'&&shell&&getComputedStyle(shell).display!=='none';
  d.querySelectorAll('.mobilebar').forEach(x=>x.style.setProperty('display',loggedIn?'grid':'none','important'));
  const b=d.getElementById('ceBizLoginButton');
  if(b&&!b.dataset.emergencyBound){
   b.dataset.emergencyBound='1';
   b.onclick=async function(){
    const f=w.credenceFirebase,err=d.getElementById('loginError'),email=d.getElementById('adminEmailInput')?.value.trim(),pass=d.getElementById('adminPasswordInput')?.value||'';
    if(!f?.auth||!f.signInWithEmailAndPassword){if(err)err.textContent='Authentication service is still loading. Please wait a moment.';return}
    if(!email||!pass){if(err)err.textContent='Enter admin email and password.';return}
    b.disabled=true;b.innerHTML='<span>Signing in…</span><span>→</span>';if(err)err.textContent='';
    try{
      const cred=await f.signInWithEmailAndPassword(f.auth,email,pass);const user=cred.user;
      let authorized=user.uid===f.ADMIN_UID;
      if(!authorized){const mod=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js');const snap=await mod.getDoc(mod.doc(f.db,'superAdmins',user.uid));authorized=snap.exists()&&snap.data().active===true;}
      if(!authorized){await f.signOut(f.auth);throw new Error('This Firebase account is not an authorized CREDENCE admin.');}
      if(gate)gate.style.display='none';if(shell)shell.style.display='block';const who=d.getElementById('adminEmail');if(who)who.textContent=user.email||'Firebase Admin';d.body.classList.remove('ceBusinessLogin');d.querySelectorAll('.mobilebar').forEach(x=>x.style.setProperty('display','grid','important'));b.disabled=false;b.innerHTML='<span>Login as Admin</span><span>→</span>';
    }catch(e){console.error('CREDENCE emergency login:',e);if(err)err.textContent=e?.code?e.code+': '+(e.message||'Login failed.'):e?.message||'Login failed.';b.disabled=false;b.innerHTML='<span>Login as Admin</span><span>→</span>';}
   };
  }
 }
 frame.addEventListener('load',function(){patch();if(timer)clearInterval(timer);timer=setInterval(patch,300)});
})();
</script>
</body></html>
