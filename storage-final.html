<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE Storage</title><style>body{font-family:system-ui;background:#f3f7f4;color:#17352a;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0001}.btn{border:0;border-radius:10px;background:#08783f;color:white;padding:11px 15px;font-weight:800}.alt{background:white;color:#08783f;border:1px solid #08783f}.status{margin:15px 0;word-break:break-word}.file{border:1px solid #dfe9e2;border-radius:12px;padding:12px;margin:9px 0;display:flex;gap:10px}.grow{flex:1}.actions{display:flex;gap:6px}.danger{color:#d94747;background:white;border:1px solid #d94747}</style></head><body><div class="wrap"><div class="card"><h1>☁️ CREDENCE Storage</h1><p>Private Supabase bucket • credence-files</p><div id="auth">Checking Admin login…</div><p><input id="file" type="file" accept="application/pdf,.pdf"></p><button id="upload" class="btn" disabled>Upload PDF</button><div id="status" class="status"></div><hr><b>Stored files</b><button id="refresh" class="btn alt" style="float:right">Refresh</button><div id="files"></div></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,onAuthStateChanged,getIdToken}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyCka8C2otBgwXwT2Qtg5bZcPG3J_84Wgs8',authDomain:'credence-76953.firebaseapp.com',projectId:'credence-76953',storageBucket:'credence-76953.firebasestorage.app',messagingSenderId:'973979489973',appId:'1:973979489973:web:ac260b237071f7007050fc'};const UID='aBYdbFwbsTUbpmYtoNurxyu3Roj2';const FN='https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/super-handler';const auth=getAuth(initializeApp(cfg));let user=null;const $=x=>document.getElementById(x);function msg(x){$('status').textContent=x}async function call(action,file=null,path=null){if(!user||user.uid!==UID)throw Error('Login as the authorized CREDENCE admin first.');const t=await getIdToken(user,true);const f=new FormData();f.append('firebaseToken',t);f.append('action',action);if(file)f.append('file',file);if(path)f.append('path',path);let r;try{r=await fetch(FN,{method:'POST',body:f})}catch(e){throw Error('Network/CORS: '+(e?.message||'Failed to fetch'))}const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error('Supabase '+r.status+': '+(d.error||raw||'Request failed'));if(!d.success)throw Error(d.error||'Storage request failed');return d}async function load(){if(!user)return;msg('Loading…');try{const d=await call('list');$('files').innerHTML='';for(const x of d.files||[]){const row=document.createElement('div');row.className='file';const c=document.createElement('div');c.className='grow';c.innerHTML='<b></b><small></small>';c.firstChild.textContent=x.name;c.lastChild.textContent=x.created_at?' • '+new Date(x.created_at).toLocaleString():'';const a=document.createElement('div');a.className='actions';const v=document.createElement('button');v.className='btn alt';v.textContent='View';v.onclick=async()=>{try{const d=await call('signed',null,'notes/'+x.name);location.href=d.url}catch(e){msg('❌ '+e.message)}};const z=document.createElement('button');z.className='btn danger';z.textContent='Delete';z.onclick=async()=>{if(confirm('Delete '+x.name+'?'))try{await call('delete',null,'notes/'+x.name);load()}catch(e){msg('❌ '+e.message)}};a.append(v,z);row.append(c,a);$('files').append(row)}msg((d.files||[]).length?'':'No files uploaded yet.')}catch(e){msg('❌ '+e.message)}}async function upload(){const x=$('file').files[0];if(!x)return msg('Choose a PDF first.');if(x.type!=='application/pdf'&&!x.name.toLowerCase().endsWith('.pdf'))return msg('❌ PDF only.');if(x.size>52428800)return msg('❌ Maximum 50 MB.');$('upload').disabled=true;msg('Uploading securely…');try{const d=await call('upload',x);msg('✅ Uploaded: '+d.fileName);$('file').value='';await load()}catch(e){msg('❌ '+e.message)}finally{$('upload').disabled=false}}$('upload').onclick=upload;$('refresh').onclick=load;onAuthStateChanged(auth,u=>{user=u&&u.uid===UID?u:null;$('upload').disabled=!user;$('auth').textContent=user?'✅ Authorized CREDENCE admin signed in':'⚠️ Login to the CREDENCE Admin first.';if(user)load()});
</script></body></html>
