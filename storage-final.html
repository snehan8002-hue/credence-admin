<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDENCE Admin Storage</title>
<style>
body{margin:0;background:#f3f7f4;color:#17352a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dfe9e2;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0a46201c}.top{display:flex;align-items:center;gap:12px}.grow{flex:1}h1{margin:0;font-size:22px}p{color:#718078;font-size:13px}.btn{border:0;border-radius:10px;background:#08783f;color:white;padding:10px 14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.alt{background:white;color:#08783f;border:1px solid #08783f}.drop{margin-top:18px;padding:18px;border:1px dashed #9bb9a6;border-radius:14px}.status{margin:14px 0;font-size:13px;word-break:break-word}.files{display:grid;gap:9px;margin-top:12px}.file{border:1px solid #dfe9e2;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}.name{font-weight:800;font-size:13px}.meta{font-size:11px;color:#718078}.actions{display:flex;gap:6px;margin-left:auto}.danger{color:#d94747;border-color:#d94747;background:white}.login{padding:12px;background:#fff8e8;border:1px solid #f0d899;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="top"><div class="grow"><h1>☁️ CREDENCE Storage</h1><p>Private Supabase bucket • credence-files</p></div><button class="btn alt" onclick="location.reload()">Refresh</button></div>
<div id="auth" class="login">Checking CREDENCE admin login…</div>
<div class="drop"><b>Upload study PDF</b><p>PDF only • maximum 50 MB</p><input id="file" type="file" accept="application/pdf,.pdf"><br><br><button id="upload" class="btn" onclick="uploadFile()" disabled>Upload PDF</button></div>
<div id="status" class="status"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><b>Stored files</b><button class="btn alt" onclick="loadFiles()">Refresh files</button></div><div id="files" class="files"></div>
</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import{getAuth,onAuthStateChanged,getIdToken}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyCka8C2otBgwXwT2Qtg5bZcPG3J_84Wgs8',authDomain:'credence-76953.firebaseapp.com',projectId:'credence-76953',storageBucket:'credence-76953.firebasestorage.app',messagingSenderId:'973979489973',appId:'1:973979489973:web:ac260b237071f7007050fc'};
const ADMIN_UID='aBYdbFwbsTUbpmYtoNurxyu3Roj2';
const FN='https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/super-handler';
const auth=getAuth(initializeApp(firebaseConfig));let user=null;
const $=id=>document.getElementById(id);function status(x){$('status').textContent=x}
async function token(){if(!user||user.uid!==ADMIN_UID)throw Error('Please login as the authorized CREDENCE admin first.');return getIdToken(user,true)}
async function call(action,file=null,path=null){const t=await token();const form=new FormData();form.append('action',action);if(file)form.append('file',file);if(path)form.append('path',path);let r;try{r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+t},body:form})}catch(e){throw Error('Network/CORS error: '+(e?.message||'Failed to fetch'))}const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error('Supabase '+r.status+': '+(d.error||raw||'Request failed'));if(!d.success)throw Error(d.error||'Storage request failed');return d}
async function uploadFile(){const f=$('file').files[0];if(!f)return status('Choose a PDF first.');if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return status('❌ Only PDF files are allowed.');if(f.size>50*1024*1024)return status('❌ PDF must be 50 MB or smaller.');$('upload').disabled=true;status('Uploading securely…');try{const d=await call('upload',f);$('file').value='';status('✅ Uploaded: '+d.fileName);await loadFiles()}catch(e){console.error(e);status('❌ '+e.message)}finally{$('upload').disabled=false}}
async function loadFiles(){if(!user)return;status('Loading files…');try{const d=await call('list');const fs=Array.isArray(d.files)?d.files:[];$('files').innerHTML='';if(!fs.length){$('files').innerHTML='<div class="meta">No files uploaded yet.</div>';status('');return}for(const f of fs){const row=document.createElement('div');row.className='file';const c=document.createElement('div');c.className='grow';c.innerHTML='<div class="name"></div><div class="meta"></div>';c.querySelector('.name').textContent=f.name||'Unnamed file';c.querySelector('.meta').textContent=(f.metadata?.size?formatBytes(Number(f.metadata.size)):'')+(f.created_at?' • '+new Date(f.created_at).toLocaleString():'');const a=document.createElement('div');a.className='actions';const v=document.createElement('button');v.className='btn alt';v.textContent='View';v.onclick=()=>viewFile(f.name);const x=document.createElement('button');x.className='btn danger';x.textContent='Delete';x.onclick=()=>deleteFile(f.name);a.append(v,x);row.append('📄',c,a);$('files').append(row)}status('') }catch(e){console.error(e);status('❌ '+e.message)}}
async function viewFile(name){try{const d=await call('signed',null,'notes/'+name);window.open(d.url,'_blank','noopener,noreferrer')}catch(e){status('❌ '+e.message)}}
async function deleteFile(name){if(!confirm('Delete '+name+'?'))return;try{await call('delete',null,'notes/'+name);status('✅ Deleted');await loadFiles()}catch(e){status('❌ '+e.message)}}
function formatBytes(n){if(!n)return'0 B';const u=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),u.length-1);return(n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
onAuthStateChanged(auth,u=>{user=u&&u.uid===ADMIN_UID?u:null;$('upload').disabled=!user;$('auth').textContent=user?'✅ Authorized CREDENCE admin signed in':'⚠️ Login to the CREDENCE Admin first.';if(user)loadFiles()});
window.uploadFile=uploadFile;window.loadFiles=loadFiles;window.viewFile=viewFile;window.deleteFile=deleteFile;
</script></body></html>
