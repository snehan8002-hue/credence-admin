ter;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;background:var(--soft);color:var(--p);border-radius:99px;font-size:10px;font-weight:900}.badge.bad{background:#fff0ef;color:var(--bad)}.chat{display:grid;grid-template-columns:260px 1fr;gap:10px;min-height:65vh}.chatSide,.chatMain{background:var(--card);border:1px solid var(--line);border-radius:16px}.chatSide{padding:8px}.chatUser{padding:10px;border-radius:11px;border:0;background:transparent;width:100%;text-align:left}.chatUser.active{background:var(--soft)}.msgs{height:55vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f7faf8}.bubble{max-width:75%;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:14px;align-self:flex-start}.bubble.mine{align-self:flex-end;background:var(--soft)}.bubble img,.bubble video{max-width:280px;max-height:220px;border-radius:10px}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.composer textarea{flex:1}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}@media(max-width:900px){.auth{grid-template-columns:1fr}.hero{display:none}.grid,.grid3{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}}@media(max-width:560px){.grid,.grid3{grid-template-columns:1fr}.profileName{display:none}.nav{height:66px}.main{padding:12px}.bubble{max-width:88%}}</style></head><body><div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui"><div style="text-align:center"><div style="font-size:42px;font-weight:900;color:#08783f">CREDENCE</div><div>Loading…</div></div></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const SB=createClient('https://tasoycsbzceohgjxizdp.supabase.co','sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',{auth:{persistSession:true,autoRefreshToken:true}});const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)],esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let s={session:null,p:null,role:'student',page:'home',mode:'password',tab:'login',otp:'email',otpSent:false,settings:null,banners:[],content:[],live:[],chatUsers:[],conv:null,msgs:[],menu:false,accent:localStorage.ccAccent||'#08783f',theme:localStorage.ccTheme||'light'};function theme(){document.documentElement.style.setProperty('--p',s.accent);document.documentElement.classList.toggle('dark',s.theme==='dark')}function toast(x){let n=document.createElement('div');n.className='modal';n.innerHTML=`<div class="modalin" style="width:auto">${esc(x)}</div>`;document.body.append(n);setTimeout(()=>n.remove(),1400)}function master(){return['master','admin'].includes(s.role)}async function load(){auth();try{let{data:{session}}=await SB.auth.getSession();s.session=session;if(!session)return;await profile();await settings();await Promise.all([banners(),content(),live()]);await page()}catch(e){console.error('CREDENCE startup error',e);if(!s.session)auth()}}async function profile(){let{data}=await SB.from('profiles').select('*').eq('id',s.session.user.id).maybeSingle();s.p=data;s.role=data?.role||'student';s.accent=data?.accent_color||s.accent;theme()}async function settings(){let{data}=await SB.from('app_settings').select('*').eq('id',true).maybeSingle();s.settings=data||{tagline:'Learn smarter. Achieve more.',app_version:'1.0.0',primary_color:'#08783f',secondary_color:'#0b5b3e'}}async function banners(){let{data}=await SB.from('banners').select('*').eq('active',true).order('sort_order').order('created_at',{ascending:false});s.banners=data||[]}async function content(){let{data}=await SB.from('content_items').select('*').eq('published',true).order('created_at',{ascending:false});s.content=data||[]}async function live(){let{data}=await SB.from('live_streams').select('*').order('scheduled_at');s.live=data||[]}function auth(){theme();$('#app').innerHTML=`<div class="auth"><section class="hero"><div class="brand"><div class="mark">C</div><div><b>CREDENCE</b><div class="muted" style="color:#bfe7cf">SMART EDUCATION PLATFORM</div></div></div><h1>Learn smarter.<br>Achieve more.</h1><p>${esc(s.settings?.tagline||'Learn smarter. Achieve more.')} Notes, tests, live classes, attendance, chat and UPI purchases in one workspace.</p></section><section class="authCard"><div class="box"><div class="brand"><div class="mark">C</div><div><b>CREDENCE</b><div class="muted">Your learning workspace</div></div></div><div class="authTabs"><button class="${s.tab==='login'?'active':''}" data-tab="login">Login</button><button class="${s.tab==='register'?'active':''}" data-tab="register">Register</button></div><div class="authTabs"><button class="${s.mode==='password'?'active':''}" data-mode="password">Password</button><button class="${s.mode==='otp'?'active':''}" data-mode="otp">OTP</button></div>${s.mode==='password'?`<form id="af"><div class="field"><label>${s.tab==='login'?'Email or Username':'Username'}</label><input id="id" required placeholder="${s.tab==='login'?'you@example.com or snehan':'your username'}"></div>${s.tab==='register'?'<div class="field"><label>Full name</label><input id="name" required></div>':''}<div class="field"><label>Password</label><input id="pw" type="password" minlength="6" required></div><button class="btn primary full">${s.tab==='login'?'Sign in':'Create student account'}</button><div id="ae" class="err hidden"></div></form>`:`<div class="authTabs"><button class="${s.otp==='email'?'active':''}" data-otp="email">Email OTP</button><button class="${s.otp==='phone'?'active':''}" data-otp="phone">Phone OTP</button></div><div class="field"><label>${s.otp==='email'?'Email':'Phone (+91...)'}</label><input id="ot" ${s.otp==='email'?'type="email"':'type="tel"'}></div>${s.otpSent?'<div class="field"><label>Code</label><input id="oc" inputmode="numeric"></div><button class="btn primary full" id="verify">Verify</button>':'<button class="btn primary full" id="send">Send code</button>'}<div id="oe" class="err hidden"></div>`}</div></section></div>`;wireAuth()}function wireAuth(){$$('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;auth()});$$('[data-mode]').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;s.otpSent=false;auth()});$$('[data-otp]').forEach(b=>b.onclick=()=>{s.otp=b.dataset.otp;s.otpSent=false;auth()});$('#af')?.addEventListener('submit',async e=>{e.preventDefault();let er=$('#ae');try{let id=$('#id').value.trim();if(s.tab==='register'){let{error}=await SB.auth.signUp({email:id,password:$('#pw').value,options:{data:{username:id,full_name:$('#name').value}}});if(error)throw error;toast('Account created. Check email if confirmation is enabled.')}else{let email=id;if(!id.includes('@')){let{data,error}=await SB.rpc('lookup_username',{username_in:id});if(error)throw error;if(!data)throw Error('Username not found');email=data}let{error}=await SB.auth.signInWithPassword({email,password:$('#pw').value});if(error)throw error}}catch(e){er.textContent=e.message;er.classList.remove('hidden')}});$('#send')?.addEventListener('click',async()=>{let er=$('#oe');try{let x=$('#ot').value.trim();let r=s.otp==='email'?await SB.auth.signInWithOtp({email:x,options:{shouldCreateUser:true}}):await SB.auth.signInWithOtp({phone:x});if(r.error)throw r.error;s.otpSent=true;auth();toast('Code sent')}catch(e){er.textContent=e.message;er.classList.remove('hidden')}});$('#verify')?.addEventListener('click',async()=>{let er=$('#oe');try{let x=$('#ot').value.trim(),token=$('#oc').value.trim(),{error}=await SB.auth.verifyOtp({[s.otp]:x,token,type:s.otp==='email'?'email':'sms'});if(error)throw error}catch(e){er.textContent=e.message;er.classList.remove('hidden')}})}function nav(){let a=master()?[['home','Home'],['users','Users'],['content','Content'],['attendance','Attendance'],['live','Live'],['orders','Orders'],['settings','Settings']]:[['home','Home'],['learn','Learn'],['tests','Tests'],['chat','Chat'],['live','Live'],['orders','Purchases'],['settings','Settings']];return `<nav class="nav">${a.map(x=>`<button class="${s.page===x[0]?'active':''}" data-page="${x[0]}"><b>${({home:'⌂',users:'♙',content:'◫',attendance:'▣',live:'◉',learn:'▤',tests:'✓',chat:'◌',orders:'₹',settings:'⚙'})[x[0]]}</b>${x[1]}</button>`).join('')}</nav>`}function top(){return `<header class="top"><div class="topin"><div class="brand"><div class="mark" style="width:40px;height:40px">C</div><div><b>CREDENCE</b><div class="muted">${s.role}</div></div></div><div class="right"><button class="btn secondary" id="prof"><span class="profileName">${esc(s.p?.full_name||s.p?.username||'Profile')}</span> <span class="avatar">${esc((s.p?.full_name||'C')[0].toUpperCase())}</span></button><button class="btn secondary" id="dots">⋮</button><div class="menu ${s.menu?'':'hidden'}"><button data-go="settings">⚙ Settings</button><button data-go="custom">✦ Customisation</button><button id="lo">↪ Log out</button><div class="muted" style="padding:8px;font-size:11px">Version ${esc(s.settings?.app_version||'1.0.0')}</div></div></div></div></header>`}async function page(){let body=s.page==='home'?home():s.page==='learn'?cards('note'):s.page==='tests'?cards('test'):s.page==='users'?users():s.page==='content'?contentAdmin():s.page==='attendance'?attendance():s.page==='live'?livePage():s.page==='chat'?chatPage():s.page==='orders'?orders():s.page==='custom'?custom():settings();$('#app').innerHTML=`<div class="shell">${top()}<main class="main">${body}</main>${nav()}</div>`;wirePage()}function home(){let b=s.banners[0];return `${b?`<section class="card" style="background:linear-gradient(135deg,var(--p),#0b5b3e);color:#fff;margin-bottom:16px"><div class="muted" style="color:#cfeee0">CREDENCE</div><h1>${esc(b.title)}</h1><p>${esc(b.subtitle||'')}</p></section>`:`<section class="card" style="background:linear-gradient(135deg,var(--p),#0b5b3e);color:#fff"><div class="muted" style="color:#dff4e8">CREDENCE</div><h1>Learn. Manage. Grow.</h1><p>${esc(s.settings?.tagline)}</p></section>`}<section class="section"><div class="grid"><div class="card metric">Notes<strong>${s.content.filter(x=>x.kind==='note').length}</strong></div><div class="card metric">Tests<strong>${s.content.filter(x=>['test','quiz'].includes(x.kind)).length}</strong></div><div class="card metric">Live<strong>${s.live.filter(x=>x.is_live).length}</strong></div><div class="card metric">Role<strong>${esc(s.role)}</strong></div></div></section><section class="section"><div class="sectionTitle"><div><h2>${master()?'Control centre':'Continue learning'}</h2><div class="muted">${master()?'Publish and manage learning operations.':'Open notes, tests, chat and live classes.'}</div></div></div><div class="grid3">${s.content.slice(0,6).map(c=>`<div class="card"><span class="badge">${esc(c.kind)}</span><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description||'')}</p><button class="btn ${c.tier==='paid'?'primary':'secondary'}" data-content="${c.id}">${c.tier==='paid'?'₹'+c.price_inr:'Open'}</button></div>`).join('')}</div></section>`}function cards(kind){let ar=kind==='note'?s.content.filter(x=>x.kind==='note'):s.content.filter(x=>['test','quiz'].includes(x.kind));return `<div class="sectionTitle"><div><h2>${kind==='note'?'Notes & Study Material':'Tests & Quizzes'}</h2><div class="muted">${kind==='note'?'Native PDF viewer and offline download.':'Timed attempts with instant scorecards.'}</div></div>${master()?'<button class="btn primary" id="newc">+ Publish</button>':''}</div><div class="grid3">${ar.map(c=>`<div class="card"><span class="badge ${c.tier==='paid'?'bad':''}">${c.tier==='paid'?'₹'+c.price_inr:'FREE'}</span><h3>${esc(c.title)}</h3><p class="muted">${esc(c.description||'')}</p><div class="actions">${c.tier==='paid'&&!master()?`<button class="btn primary" data-buy="${c.id}">Unlock</button>`:''}${kind==='note'?`<button class="btn secondary" data-note="${c.id}">View PDF</button>`:`<button class="btn primary" data-test="${c.id}">Start</button>`}</div></div>`).join('')||'<div class="card">No content published yet.</div>'}</div>`}async function users(){if(!master())return profileCard();let{data}=await SB.from('profiles').select('id,full_name,username,email,role,active,banned').order('created_at',{ascending:false});return `<div class="sectionTitle"><div><h2>User Management</h2><div class="muted">Add, edit, ban and permanently delete accounts.</div></div><div class="actions"><button class="btn primary" id="addS">+ Student</button>${s.role==='admin'?'<button class="btn secondary" id="addM">+ Master</button>':''}</div></div><div class="card" style="overflow:auto"><table class="table"><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username||'')}</td><td>${esc(u.role)}</td><td>${u.banned?'BANNED':u.active?'ACTIVE':'INACTIVE'}</td><td><button class="btn secondary" data-eu="${u.id}">Edit</button> <button class="btn danger" data-du="${u.id}">Delete</button></td></tr>`).join('')}</table></div>`}function profileCard(){return `<div class="card"><div class="row"><div><h2>${esc(s.p?.full_name||'Your profile')}</h2><p class="muted">${esc(s.p?.email||s.p?.phone||'')}</p></div><button class="btn secondary" id="editp">Edit profile</button></div></div>`}function contentAdmin(){return `<div class="sectionTitle"><div><h2>Content Studio</h2><div class="muted">Notes, tests, quizzes and videos; free or paid.</div></div><button class="btn primary" id="newc">+ Publish</button></div><div class="grid3">${s.content.map(c=>`<div class="card"><span class="badge">${esc(c.kind)}</span><h3>${esc(c.title)}</h3><div class="muted">${esc(c.description||'')}</div><div class="actions" style="margin-top:10px"><button class="btn secondary" data-ec="${c.id}">Edit</button><button class="btn danger" data-dc="${c.id}">Delete</button></div></div>`).join('')}</div>`}async function attendance(){if(!master()){let{data}=await SB.from('attendance').select('*').eq('student_id',s.session.user.id).order('class_date',{ascending:false});return `<h2>Attendance</h2><div class="list">${(data||[]).map(a=>`<div class="card row"><span>${a.class_date}</span><span class="badge">${a.status}</span></div>`).join('')||'<div class="card">No attendance records.</div>'}</div>`}let{data}=await SB.from('profiles').select('id,full_name,username').eq('role','student');return `<h2>Daily Attendance</h2><div class="card" style="overflow:auto"><table class="table"><tr><th>Student</th><th>Date</th><th>Status</th><th></th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.full_name||u.username)}</td><td><input type="date" data-ad="${u.id}" value="${new Date().toISOString().slice(0,10)}"></td><td><select data-as="${u.id}"><option>present</option><option>absent</option><option>late</option><option>leave</option></select></td><td><button class="btn primary" data-sa="${u.id}">Save</button></td></tr>`).join('')}</table></div>`}function livePage(){return `<div class="sectionTitle"><div><h2>Live Classroom</h2><div class="muted">Native video player and recorded-stream access.</div></div>${master()?'<button class="btn primary" id="newlive">+ Schedule</button>':''}</div><div class="grid3">${s.live.map(l=>`<div class="card"><span class="badge ${l.is_live?'':'bad'}">${l.is_live?'LIVE':'SCHEDULED'}</span><h3>${esc(l.title)}</h3><p class="muted">${esc(l.description||'')}</p>${l.playback_url?`<button class="btn primary" data-live="${l.id}">Watch</button>`:''}</div>`).join('')||'<div class="card">No live streams yet.</div>'}</div>`}async function chatPage(){if(!s.chatUsers.length){let{data}=await SB.from('profiles').select('id,full_name,username,role').neq('id',s.session.user.id).order('full_name');s.chatUsers=data||[]}return `<div class="chat"><aside class="chatSide"><b>Chats</b>${s.chatUsers.map(u=>`<button class="chatUser" data-cu="${u.id}"><b>${esc(u.full_name||u.username)}</b><div class="muted" style="font-size:11px">${u.role}</div></button>`).join('')}</aside><section class="chatMain"><div class="row" style="padding:12px;border-bottom:1px solid var(--line)"><b>WhatsApp-style chat</b><span class="muted">Photo / PDF / video</span></div><div class="msgs" id="msgs">${s.msgs.map(m=>`<div class="bubble ${m.sender_id===s.session.user.id?'mine':''}">${m.body?esc(m.body):''}${m.media_url?`<div style="margin-top:6px"><a href="${esc(m.media_url)}" target="_blank">📎 ${esc(m.media_name||'Media')}</a></div>`:''}<div class="muted" style="font-size:9px">${new Date(m.created_at).toLocaleTimeString()}</div></div>`).join('')}</div><div class="composer"><input id="cf" type="file" hidden accept="image/*,application/pdf,video/*"><button class="btn secondary" id="att">＋</button><textarea id="ct" placeholder="Type a message…"></textarea><button class="btn primary" id="send">Send</button></div></section></div>`}async function orders(){let{data}=await SB.from('orders').select('*').eq('student_id',s.session.user.id).order('created_at',{ascending:false});if(master()){let r=await SB.from('orders').select('*').order('created_at',{ascending:false});data=r.data}return `<h2>${master()?'Orders':'Purchases'}</h2><div class="card" style="overflow:auto"><table class="table"><tr><th>Item</th><th>Amount</th><th>Status</th>${master()?'<th></th>':''}</tr>${(data||[]).map(o=>`<tr><td>${esc(o.note||o.course_id||o.content_id||'Purchase')}</td><td>₹${o.amount_inr}</td><td>${o.status}</td>${master()&&o.status==='pending'?`<td><button class="btn primary" data-paid="${o.id}">Mark paid</button></td>`:master()?'<td></td>':''}</tr>`).join('')}</table></div>`}function custom(){return `<h2>Customisation</h2><div class="card"><div class="field"><label>Accent</label><div class="actions">${['#08783f','#1f6feb','#7c3aed','#c2410c','#0f766e','#be185d','#111827'].map(c=>`<button class="btn" data-ac="${c}" style="background:${c};color:#fff">●</button>`).join('')}</div></div>${master()?`<div class="field"><label>App tagline</label><input id="tag" value="${esc(s.settings?.tagline||'')}"></div><div class="field"><label>UPI ID</label><input id="upi" value="${esc(s.settings?.upi_id||'')}" placeholder="merchant@upi"></div><button class="btn primary" id="saveSet">Save</button><hr><h3>Dynamic banners</h3><div class="formGrid"><input id="bt" placeholder="Title"><input id="bs" placeholder="Subtitle"><input id="ba" placeholder="Button text"><input id="bu" placeholder="URL"></div><button class="btn secondary" id="saveBanner">Publish banner</button>`:''}</div>`}function settings(){return `<h2>Settings</h2><div class="card"><div class="row"><span>App version</span><b>${esc(s.settings?.app_version||'1.0.0')}</b></div><div class="row" style="margin-top:15px"><span>Theme</span><select id="th"><option>light</option><option>dark</option><option>system</option></select></div><button class="btn danger" id="lo2" style="margin-top:18px">Log out</button></div>`}async function modal(html){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalin">${html}</div>`;document.body.append(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});return m}function wirePage(){$$('.nav [data-page]').forEach(b=>b.onclick=async()=>{s.page=b.dataset.page;await page()});$('#dots')?.addEventListener('click',()=>{s.menu=!s.menu;page()});$$('[data-go]').forEach(b=>b.onclick=async()=>{s.page=b.dataset.go;s.menu=false;page()});$('#lo,#lo2')?.addEventListener('click',()=>SB.auth.signOut());$('#prof,#editp')?.addEventListener('click',profileModal);$('#newc')?.addEventListener('click',contentModal);$('#newlive')?.addEventListener('click',liveModal);$('#addS')?.addEventListener('click',()=>userModal('student'));$('#addM')?.addEventListener('click',()=>userModal('master'));$$('[data-du]').forEach(b=>b.onclick=()=>delUser(b.dataset.du));$$('[data-eu]').forEach(b=>b.onclick=()=>userModal('edit',b.dataset.eu));$$('[data-dc]').forEach(b=>b.onclick=()=>delContent(b.dataset.dc));$$('[data-ec]').forEach(b=>b.onclick=()=>contentModal(b.dataset.ec));$$('[data-sa]').forEach(b=>b.onclick=()=>saveAtt(b.dataset.sa));$$('[data-paid]').forEach(b=>b.onclick=()=>paid(b.dataset.paid));$$('[data-note]').forEach(b=>b.onclick=()=>note(b.dataset.note));$$('[data-test]').forEach(b=>b.onclick=()=>test(b.dataset.test));$$('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));$$('[data-live]').forEach(b=>b.onclick=()=>stream(b.dataset.live));$$('[data-cu]').forEach(b=>b.onclick=()=>chat(b.dataset.cu));$('#att')?.addEventListener('click',()=>$('#cf').click());$('#send')?.addEventListener('click',send);$('#cf')?.addEventListener('change',upload);$$('[data-ac]').forEach(b=>b.onclick=async()=>{s.accent=b.dataset.ac;localStorage.ccAccent=s.accent;await SB.from('profiles').update({accent_color:s.accent}).eq('id',s.session.user.id);theme()});$('#th')?.addEventListener('change',e=>{s.theme=e.target.value;localStorage.ccTheme=s.theme;theme()});$('#saveSet')?.addEventListener('click',saveSet);$('#saveBanner')?.addEventListener('click',saveBanner)}async function profileModal(){let m=await modal(`<div class="row"><h3>Edit profile</h3><button class="btn secondary" data-close>×</button></div><form id="pf"><div class="field"><label>Name</label><input id="pn" value="${esc(s.p?.full_name||'')}"></div><div class="field"><label>Username</label><input id="pu" value="${esc(s.p?.username||'')}"></div><div class="field"><label>Avatar</label><input id="pa" type="file" accept="image/*"></div><button class="btn primary full">Save</button></form>`);$('#pf',m).onsubmit=async e=>{e.preventDefault();let f=$('#pa',m).files[0],url=s.p?.avatar_url||null;if(f){let path=s.session.user.id+'/avatar-'+Date.now();await SB.storage.from('avatars').upload(path,f,{upsert:true});let x=await SB.storage.from('avatars').createSignedUrl(path,31536000);url=x.data?.signedUrl||url}await SB.from('profiles').update({full_name:$('#pn',m).value,username:$('#pu',m).value||null,avatar_url:url}).eq('id',s.session.user.id);m.remove();await profile();page()}}async function userModal(mode,id){let u=id?(await SB.from('profiles').select('*').eq('id',id).maybeSingle()).data:null;let role=mode==='master'?'master':u?.role||'student';let m=await modal(`<div class="row"><h3>${mode==='edit'?'Edit':`Add ${role}`}</h3><button class="btn secondary" data-close>×</button></div><form id="uf"><div class="field"><label>Name</label><input id="un" value="${esc(u?.full_name||'')}"></div><div class="field"><label>Username</label><input id="uu" value="${esc(u?.username||'')}"></div><div class="field"><label>Email</label><input id="ue" type="email" value="${esc(u?.email||'')}"></div>${mode==='edit'?'':'<div class="field"><label>Password</label><input id="up" type="password" minlength="6" required></div>'}<button class="btn primary full">Save</button></form>`);$('#uf',m).onsubmit=async e=>{e.preventDefault();if(mode==='edit'){let r=await SB.functions.invoke('credence-admin',{body:{action:'update_user',id,full_name:$('#un',m).value,username:$('#uu',m).value,email:$('#ue',m).value}});if(r.error)toast(r.error.message)}else{let r=await SB.functions.invoke('credence-admin',{body:{action:'create_user',email:$('#ue',m).value,password:$('#up',m).value,full_name:$('#un',m).value,username:$('#uu',m).value,role}});if(r.error)toast(r.error.message)}m.remove();page()}}async function delUser(id){if(!confirm('Permanently delete this account?'))return;let r=await SB.functions.invoke('credence-admin',{body:{action:'delete_user',id}});toast(r.error?.message||'User deleted');page()}async function contentModal(id){let c=id?s.content.find(x=>x.id===id):null;let m=await modal(`<div class="row"><h3>${c?'Edit':'Publish'} content</h3><button class="btn secondary" data-close>×</button></div><form id="cfm"><div class="field"><label>Type</label><select id="ck"><option>note</option><option>test</option><option>quiz</option><option>video</option></select></div><div class="field"><label>Title</label><input id="ctt" required value="${esc(c?.title||'')}"></div><div class="field"><label>Description</label><textarea id="cd">${esc(c?.description||'')}</textarea></div><div class="field"><label>Tier</label><select id="tier"><option>free</option><option>paid</option></select></div><div class="field"><label>Price ₹</label><input id="cp" type="number" value="${c?.price_inr||0}"></div><div class="field"><label>File</label><input id="file" type="file" accept="application/pdf,image/*,video/*"></div><div class="field"><label>Video URL</label><input id="cv" value="${esc(c?.video_url||'')}"></div><button class="btn primary full">Save</button></form>`);$('#cfm',m).onsubmit=async e=>{e.preventDefault();let f=$('#file',m).files[0],path=c?.file_path||null;if(f){path=crypto.randomUUID()+'-'+f.name;let r=await SB.storage.from('content').upload(path,f);if(r.error)return toast(r.error.message)}let row={kind:$('#ck',m).value,title:$('#ctt',m).value,description:$('#cd',m).value,tier:$('#tier',m).value,price_inr:Number($('#cp',m).value||0),file_path:path,video_url:$('#cv',m).value||null,published:true,created_by:s.session.user.id};let r=c?await SB.from('content_items').update(row).eq('id',id):await SB.from('content_items').insert(row);if(r.error)toast(r.error.message);else toast('Saved');m.remove();await content();page()}}async function delContent(id){if(!confirm('Delete this content?'))return;let r=await SB.from('content_items').delete().eq('id',id);toast(r.error?.message||'Deleted');await content();page()}async function note(id){let c=s.content.find(x=>x.id===id);if(!c?.file_path)return toast('No file attached');let r=await SB.storage.from('content').createSignedUrl(c.file_path,3600);if(r.error)return toast(r.error.message);await modal(`<div class="row"><h3>${esc(c.title)}</h3><button class="btn secondary" data-close>×</button></div><iframe src="${esc(r.data.signedUrl)}" style="width:100%;height:75vh;border:0"></iframe><a class="btn secondary" href="${esc(r.data.signedUrl)}" target="_blank" download>Download offline</a>`)}async function test(id){let c=s.content.find(x=>x.id===id);let q=await SB.from('test_questions').select('*').eq('content_id',id).order('sort_order');let m=await modal(`<div class="row"><h3>${esc(c.title)}</h3><button class="btn secondary" data-close>×</button></div><div>${(q.data||[]).map((x,i)=>`<div class="card" style="margin:10px 0"><b>Q${i+1}. ${esc(x.question_text)}</b>${(x.options||[]).map((o,j)=>`<label style="display:block;padding:6px"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}</div><button class="btn primary full" id="submitT">Submit</button>`);$('#submitT',m).onclick=async()=>{let score=0,total=0,ans={};(q.data||[]).forEach((x,i)=>{total+=Number(x.marks||1);let v=$(`input[name="q${i}"]:checked`,m)?.value;if(v!==undefined){ans[x.id]=Number(v);if(Number(v)===x.correct_option)score+=Number(x.marks||1);else score-=Number(x.negative_marks||0)}});await SB.from('test_attempts').insert({content_id:id,student_id:s.session.user.id,submitted_at:new Date().toISOString(),score,total_marks:total,answers:ans});toast(`Score ${score}/${total}`);m.remove()}}async function buy(id){let c=s.content.find(x=>x.id===id),upi=s.settings?.upi_id;if(!upi)return toast('UPI ID is not configured');let o=await SB.from('orders').insert({student_id:s.session.user.id,content_id:id,amount_inr:Number(c.price_inr||0),status:'pending',payment_method:'upi',note:c.title}).select().single();if(o.error)return toast(o.error.message);location.href=`upi://pay?pa=${encodeURIComponent(upi)}&pn=Credence%20Education&am=${c.price_inr}&cu=INR&tr=${o.data.id}`}
async function stream(id){let l=s.live.find(x=>x.id===id);await modal(`<div class="row"><h3>${esc(l.title)}</h3><button class="btn secondary" data-close>×</button></div><video controls autoplay style="width:100%;min-height:480px;background:#000" src="${esc(l.playback_url||l.stream_url||'')}"></video>`)}async function liveModal(){}
async function saveAtt(id){let d=$(`[data-ad="${id}"]`).value,st=$(`[data-as="${id}"]`).value;let r=await SB.from('attendance').upsert({student_id:id,class_date:d,status:st,marked_by:s.session.user.id},{onConflict:'student_id,class_date'});toast(r.error?.message||'Attendance saved')}async function paid(id){let r=await SB.from('orders').update({status:'paid'}).eq('id',id);toast(r.error?.message||'Marked paid');page()}async function chat(uid){let mine=s.session.user.id,r=await SB.from('conversations').select('id').eq('created_by',mine).limit(1).maybeSingle();if(!r.data){let c=await SB.from('conversations').insert({created_by:mine}).select().single();s.conv=c.data.id;await SB.from('conversation_members').insert([{conversation_id:s.conv,user_id:mine},{conversation_id:s.conv,user_id:uid}])}else s.conv=r.data.id;let m=await SB.from('chat_messages').select('*').eq('conversation_id',s.conv).order('created_at');s.msgs=m.data||[];page();subscribeChat()}let cc;function subscribeChat(){if(cc)SB.removeChannel(cc);cc=SB.channel('cc'+s.conv).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`conversation_id=eq.${s.conv}`},p=>{s.msgs.push(p.new);let x=$('#msgs');if(x){x.innerHTML=s.msgs.map(m=>`<div class="bubble ${m.sender_id===s.session.user.id?'mine':''}">${m.body?esc(m.body):''}</div>`).join('');x.scrollTop=x.scrollHeight}}).subscribe()}async function send(){if(!s.conv)return toast('Choose a contact');let t=$('#ct').value.trim();if(!t)return;await SB.from('chat_messages').insert({conversation_id:s.conv,sender_id:s.session.user.id,type:'text',body:t});$('#ct').value=''}async function upload(){let f=$('#cf').files[0];if(!f||!s.conv)return;let path=s.session.user.id+'/'+crypto.randomUUID()+'-'+f.name;let r=await SB.storage.from('chat-media').upload(path,f);if(r.error)return toast(r.error.message);let typ=f.type.startsWith('image/')?'image':f.type==='application/pdf'?'pdf':f.type.startsWith('video/')?'video':'file';await SB.from('chat_messages').insert({conversation_id:s.conv,sender_id:s.session.user.id,type:typ,media_path:path,media_name:f.name,media_size:f.size});toast('Media sent')}async function saveSet(){let r=await SB.from('app_settings').update({tagline:$('#tag').value,upi_id:$('#upi').value,primary_color:s.accent}).eq('id',true);toast(r.error?.message||'Saved');settings();await settings()}async function saveBanner(){let r=await SB.from('banners').insert({title:$('#bt').value,subtitle:$('#bs').value,action_text:$('#ba').value,action_url:$('#bu').value,created_by:s.session.user.id});toast(r.error?.message||'Banner published');await banners();page()}SB.auth.onAuthStateChange((_,session)=>{s.session=session;session?load():auth()});load();
</script></body></html>
