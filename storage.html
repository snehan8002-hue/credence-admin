<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDENCE Storage</title>
<style>
:root{
  --g:#08783f;
  --g2:#0b9b55;
  --bg:#f5f7f6;
  --card:#fff;
  --text:#17201b;
  --muted:#66736b;
  --border:#dce4df;
  --danger:#c62828;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--g);
  color:white;
  padding:18px 20px;
}
header h1{
  margin:0;
  font-size:22px;
}
header p{
  margin:5px 0 0;
  opacity:.85;
}
main{
  max-width:850px;
  margin:25px auto;
  padding:0 16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}
h2{
  margin-top:0;
  font-size:19px;
}
button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:var(--g);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
input[type=file]{
  width:100%;
  padding:12px;
  border:1px dashed var(--border);
  border-radius:9px;
  margin:8px 0 14px;
  background:#fafcfb;
}
.status{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  background:#f0f5f2;
  color:var(--muted);
  white-space:pre-wrap;
  word-break:break-word;
}
.error{
  background:#fff0f0;
  color:var(--danger);
}
.file{
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.file:last-child{
  border-bottom:0;
}
.file-name{
  font-weight:bold;
  word-break:break-word;
}
.file-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}
.file-actions{
  margin-top:9px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.secondary{
  background:#e9efeb;
  color:var(--g);
}
.danger{
  background:#c62828;
}
.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>CREDENCE Storage</h1>
  <p>Admin PDF Storage</p>
</header>

<main>

  <div class="card">
    <h2>Upload PDF</h2>

    <input id="fileInput" type="file" accept="application/pdf,.pdf">

    <button id="uploadBtn">Upload PDF</button>

    <div id="uploadStatus" class="status">
      Select a PDF to upload.
    </div>
  </div>

  <div class="card">
    <h2>Uploaded Files</h2>

    <button id="refreshBtn" class="secondary">
      Refresh Files
    </button>

    <div id="fileList" class="status">
      Loading...
    </div>
  </div>

</main>

<script type="module">

import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js'

import {
  getAuth,
  onAuthStateChanged,
  getIdToken
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'


/* Firebase */

const FIREBASE_CONFIG = {
  apiKey:'AIzaSyCka8C2otBgwXwT2Qtg5bZcPG3J_84Wgs8',
  authDomain:'credence-76953.firebaseapp.com',
  projectId:'credence-76953',
  storageBucket:'credence-76953.firebasestorage.app',
  messagingSenderId:'973979489973',
  appId:'1:973979489973:web:ac260b237071f7007050fc'
}

const ADMIN_UID = 'aBYdbFwbsTUbpmYtoNurxyu3Roj2'


/* Supabase Edge Function */

const FN =
  'https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/super-handler'


const app = initializeApp(FIREBASE_CONFIG)
const auth = getAuth(app)


let currentUser = null


const fileInput =
  document.getElementById('fileInput')

const uploadBtn =
  document.getElementById('uploadBtn')

const refreshBtn =
  document.getElementById('refreshBtn')

const uploadStatus =
  document.getElementById('uploadStatus')

const fileList =
  document.getElementById('fileList')


function setStatus(element,message,isError=false){

  element.textContent = message

  element.classList.toggle('error',isError)

}


async function getFirebaseToken(){

  if(!currentUser){
    throw new Error('Admin is not signed in')
  }

  if(currentUser.uid !== ADMIN_UID){
    throw new Error('Unauthorized CREDENCE admin')
  }

  return await getIdToken(currentUser,true)
}


async function callStorage(action,file=null,path=null){

  const idToken = await getFirebaseToken()

  const form = new FormData()

  form.append('action',action)

  if(file){
    form.append('file',file)
  }

  if(path){
    form.append('path',path)
  }


  const response = await fetch(FN,{
    method:'POST',

    headers:{
      Authorization:'Bearer '+idToken
    },

    body:form
  })


  let data

  try{
    data = await response.json()
  }catch{
    throw new Error(
      'Supabase returned a non-JSON response ('+
      response.status+')'
    )
  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `Supabase request failed (${response.status})`
    )
  }


  if(data?.success === false){

    throw new Error(
      data?.error ||
      'Storage request failed'
    )
  }


  return data
}


/* Authentication */

onAuthStateChanged(auth,async user=>{

  currentUser = user

  if(!user){

    setStatus(
      uploadStatus,
      'Please sign in to CREDENCE Admin.',
      true
    )

    fileList.textContent =
      'Please sign in to view files.'

    uploadBtn.disabled = true
    refreshBtn.disabled = true

    return
  }


  if(user.uid !== ADMIN_UID){

    setStatus(
      uploadStatus,
      'Unauthorized CREDENCE admin.',
      true
    )

    fileList.textContent =
      'Unauthorized admin.'

    uploadBtn.disabled = true
    refreshBtn.disabled = true

    return
  }


  uploadBtn.disabled = false
  refreshBtn.disabled = false

  setStatus(
    uploadStatus,
    'Admin authenticated. Select a PDF.'
  )

  await loadFiles()

})


/* Upload */

uploadBtn.addEventListener('click',async()=>{

  const file = fileInput.files?.[0]

  if(!file){

    setStatus(
      uploadStatus,
      'Please select a PDF first.',
      true
    )

    return
  }


  if(
    file.type !== 'application/pdf' &&
    !file.name.toLowerCase().endsWith('.pdf')
  ){

    setStatus(
      uploadStatus,
      'Only PDF files are allowed.',
      true
    )

    return
  }


  if(file.size > 50 * 1024 * 1024){

    setStatus(
      uploadStatus,
      'PDF must be 50 MB or smaller.',
      true
    )

    return
  }


  uploadBtn.disabled = true

  setStatus(
    uploadStatus,
    'Uploading PDF...'
  )


  try{

    const data =
      await callStorage('upload',file)

    setStatus(
      uploadStatus,
      '✅ Upload successful: '+data.fileName
    )

    fileInput.value = ''

    await loadFiles()

  }catch(error){

    console.error(error)

    setStatus(
      uploadStatus,
      '❌ '+(
        error instanceof Error
          ? error.message
          : 'Upload failed'
      ),
      true
    )

  }finally{

    uploadBtn.disabled = false

  }

})


/* List */

async function loadFiles(){

  fileList.textContent =
    'Loading files...'


  try{

    const data =
      await callStorage('list')

    const files =
      Array.isArray(data.files)
        ? data.files
        : []


    if(!files.length){

      fileList.textContent =
        'No PDF files uploaded yet.'

      return
    }


    fileList.innerHTML = ''


    for(const file of files){

      const row =
        document.createElement('div')

      row.className = 'file'


      const name =
        document.createElement('div')

      name.className = 'file-name'

      name.textContent =
        file.name || 'Unnamed file'


      const meta =
        document.createElement('div')

      meta.className = 'file-meta'

      const size =
        typeof file.metadata?.size === 'number'
          ? Math.round(file.metadata.size / 1024)
          : null

      meta.textContent =
        size !== null
          ? `${size} KB`
          : 'PDF'


      const actions =
        document.createElement('div')

      actions.className =
        'file-actions'


      const view =
        document.createElement('button')

      view.textContent =
        'Open PDF'


      view.addEventListener('click',async()=>{

        try{

          view.disabled = true

          const path =
            'notes/'+file.name

          const data =
            await callStorage('signed',null,path)

          if(!data.url){

            throw new Error(
              'No signed URL returned'
            )
          }

          window.open(
            data.url,
            '_blank'
          )

        }catch(error){

          alert(
            error instanceof Error
              ? error.message
              : 'Unable to open PDF'
          )

        }finally{

          view.disabled = false

        }

      })


      const del =
        document.createElement('button')

      del.textContent =
        'Delete'

      del.className =
        'danger'


      del.addEventListener('click',async()=>{

        if(!confirm(
          'Delete '+file.name+'?'
        )) return


        try{

          del.disabled = true

          const path =
            'notes/'+file.name

          await callStorage(
            'delete',
            null,
            path
          )

          await loadFiles()

        }catch(error){

          alert(
            error instanceof Error
              ? error.message
              : 'Delete failed'
          )

          del.disabled = false

        }

      })


      actions.appendChild(view)
      actions.appendChild(del)

      row.appendChild(name)
      row.appendChild(meta)
      row.appendChild(actions)

      fileList.appendChild(row)

    }

  }catch(error){

    console.error(error)

    fileList.textContent =
      '❌ '+(
        error instanceof Error
          ? error.message
          : 'Unable to load files'
      )

    fileList.classList.add('error')

  }

}


/* Refresh */

refreshBtn.addEventListener(
  'click',
  loadFiles
)

</script>

</body>
  </html>
