<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREDENCE Admin — Supabase Storage</title>

<style>
:root{
  --g:#08783f;
  --bg:#f3f7f4;
  --card:#fff;
  --ink:#17352a;
  --muted:#718078;
  --line:#e1eae4;
  --red:#d94747;
  --shadow:0 12px 35px rgba(10,70,40,.14)
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink)
}

#app{
  height:100%;
  position:relative
}

iframe{
  border:0;
  width:100%;
  height:100%;
  display:block
}

.storage-launch{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:50;
  border:0;
  border-radius:14px;
  background:var(--g);
  color:#fff;
  padding:13px 16px;
  font-weight:900;
  box-shadow:var(--shadow);
  cursor:pointer
}

.storage-launch:disabled{
  opacity:.5;
  cursor:not-allowed
}

.panel{
  position:fixed;
  right:18px;
  top:18px;
  bottom:18px;
  width:min(430px,calc(100% - 36px));
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  z-index:60;
  display:none;
  flex-direction:column;
  overflow:hidden
}

.panel.show{
  display:flex
}

.head{
  padding:16px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px
}

.head .grow{
  flex:1
}

.head h2{
  margin:0;
  font-size:18px
}

.head p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px
}

.close{
  border:0;
  background:#edf5ef;
  border-radius:50%;
  width:34px;
  height:34px;
  cursor:pointer;
  font-size:18px
}

.body{
  padding:16px;
  overflow:auto
}

.drop{
  border:1px dashed #9bb9a6;
  border-radius:14px;
  padding:18px;
  text-align:center;
  background:#f7fbf8
}

.drop input{
  width:100%;
  margin-top:10px
}

.btn{
  border:0;
  border-radius:10px;
  background:var(--g);
  color:#fff;
  padding:10px 13px;
  font-weight:800;
  cursor:pointer
}

.btn.alt{
  background:#fff;
  color:var(--g);
  border:1px solid var(--g)
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.status{
  margin:10px 0;
  color:var(--muted);
  font-size:12px;
  min-height:16px;
  word-break:break-word
}

.files{
  display:grid;
  gap:8px;
  margin-top:14px
}

.file{
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  display:flex;
  gap:10px;
  align-items:center
}

.file .grow{
  min-width:0
}

.name{
  font-weight:800;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.meta{
  font-size:10px;
  color:var(--muted);
  margin-top:3px
}

.actions{
  display:flex;
  gap:5px
}

.empty{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding:20px
}

.danger{
  color:var(--red)!important;
  border-color:#efcaca!important
}
</style>
</head>

<body>

<div id="app">
  <iframe
    id="adminFrame"
    src="./index.html"
    title="CREDENCE Admin">
  </iframe>

  <button
    id="storageLaunch"
    class="storage-launch"
    disabled>
    ☁️ Storage
  </button>
</div>

<section id="panel" class="panel">

  <div class="head">
    <div class="grow">
      <h2>CREDENCE Storage</h2>
      <p>Private Supabase bucket • credence-files</p>
    </div>

    <button
      class="close"
      onclick="closePanel()">
      ×
    </button>
  </div>

  <div class="body">

    <div class="drop">

      <b>Upload study PDF</b>

      <div class="meta">
        PDF only • maximum 50 MB
      </div>

      <input
        id="file"
        type="file"
        accept="application/pdf,.pdf">

      <div style="margin-top:10px">

        <button
          id="uploadButton"
          class="btn"
          onclick="uploadFile()">
          Upload PDF
        </button>

      </div>

    </div>

    <div id="status" class="status"></div>

    <div style="display:flex;justify-content:space-between;align-items:center">

      <b>Stored files</b>

      <button
        class="btn alt"
        onclick="loadFiles()">
        Refresh
      </button>

    </div>

    <div
      id="files"
      class="files">

      <div class="empty">
        Login to the Admin panel first.
      </div>

    </div>

  </div>

</section>

<script type="module">

import {
  initializeApp
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js'

import {
  getAuth,
  onAuthStateChanged,
  getIdToken
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey:'AIzaSyCka8C2otBgwXwT2Qtg5bZcPG3J_84Wgs8',
  authDomain:'credence-76953.firebaseapp.com',
  projectId:'credence-76953',
  storageBucket:'credence-76953.firebasestorage.app',
  messagingSenderId:'973979489973',
  appId:'1:973979489973:web:ac260b237071f7007050fc'
}

const ADMIN_UID =
  'aBYdbFwbsTUbpmYtoNurxyu3Roj2'


/* =========================
   SUPABASE EDGE FUNCTION
========================= */

const FN =
  'https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/super-handler'


/* =========================
   APP
========================= */

const firebaseApp =
  initializeApp(firebaseConfig)

const auth =
  getAuth(firebaseApp)


let currentUser = null


const launch =
  document.getElementById('storageLaunch')

const panel =
  document.getElementById('panel')

const statusEl =
  document.getElementById('status')

const filesEl =
  document.getElementById('files')

const uploadButton =
  document.getElementById('uploadButton')


/* =========================
   STATUS
========================= */

function setStatus(message){
  statusEl.textContent = message
}


/* =========================
   AUTH
========================= */

function setReady(user){

  currentUser =
    user && user.uid === ADMIN_UID
      ? user
      : null

  launch.disabled =
    !currentUser

  launch.title =
    currentUser
      ? 'Open private Supabase Storage'
      : 'Login as the authorized CREDENCE admin'

  if(!currentUser){

    closePanel()

    filesEl.innerHTML =
      '<div class="empty">Login to the Admin panel first.</div>'

  }
}


onAuthStateChanged(
  auth,
  setReady
)


/* =========================
   PANEL
========================= */

function openPanel(){

  if(!currentUser){

    setStatus(
      'Please login as the authorized CREDENCE admin first.'
    )

    return
  }

  panel.classList.add('show')

  loadFiles()
}


function closePanel(){

  panel.classList.remove('show')
}


/* =========================
   FIREBASE TOKEN
========================= */

async function getFirebaseToken(){

  if(!currentUser){

    throw new Error(
      'Please login as the authorized CREDENCE admin first.'
    )

  }

  if(currentUser.uid !== ADMIN_UID){

    throw new Error(
      'Unauthorized CREDENCE admin'
    )

  }

  return await getIdToken(
    currentUser,
    true
  )
}


/* =========================
   SUPABASE REQUEST
========================= */

async function callStorage(
  action,
  file = null,
  path = null
){

  const idToken =
    await getFirebaseToken()


  const form =
    new FormData()


  /*
    IMPORTANT:
    Firebase token is sent inside
    FormData instead of Authorization
    header to avoid browser CORS
    preflight problems.
  */

  form.append(
    'firebaseToken',
    idToken
  )

  form.append(
    'action',
    action
  )


  if(file){

    form.append(
      'file',
      file
    )

  }


  if(path){

    form.append(
      'path',
      path
    )

  }


  let response

  try{

    response =
      await fetch(
        FN,
        {
          method:'POST',
          body:form
        }
      )

  }catch(error){

    console.error(
      'Storage network error:',
      error
    )

    throw new Error(
      'Network/CORS error: ' +
      (
        error instanceof Error
          ? error.message
          : 'Failed to fetch'
      )
    )

  }


  const raw =
    await response.text()


  let data = {}

  try{

    data =
      JSON.parse(raw)

  }catch{

    data = {}

  }


  if(!response.ok){

    const detail =
      data.error ||
      data.message ||
      raw ||
      'No response body'

    throw new Error(
      'Supabase ' +
      response.status +
      ': ' +
      detail
    )

  }


  if(!data.success){

    throw new Error(
      data.error ||
      data.message ||
      'Storage request failed'
    )

  }


  return data
}


/* =========================
   UPLOAD
========================= */

async function uploadFile(){

  const input =
    document.getElementById('file')

  const file =
    input.files[0]


  if(!file){

    setStatus(
      'Choose a PDF first.'
    )

    return

  }


  if(
    file.type !== 'application/pdf' &&
    !file.name
      .toLowerCase()
      .endsWith('.pdf')
  ){

    setStatus(
      'Only PDF files are allowed.'
    )

    return

  }


  if(
    file.size >
    50 * 1024 * 1024
  ){

    setStatus(
      'PDF must be 50 MB or smaller.'
    )

    return

  }


  uploadButton.disabled = true


  try{

    setStatus(
      'Uploading securely…'
    )


    const data =
      await callStorage(
        'upload',
        file
      )


    input.value = ''


    setStatus(
      '✅ Upload complete: ' +
      (
        data.fileName ||
        file.name
      )
    )


    await loadFiles()

  }catch(error){

    console.error(
      'Upload error:',
      error
    )

    setStatus(
      '❌ ' +
      (
        error instanceof Error
          ? error.message
          : 'Upload failed'
      )
    )

  }finally{

    uploadButton.disabled = false

  }

}


/* =========================
   LIST FILES
========================= */

async function loadFiles(){

  if(!currentUser){

    filesEl.innerHTML =
      '<div class="empty">Login to the Admin panel first.</div>'

    return

  }


  try{

    setStatus(
      'Loading files…'
    )


    const data =
      await callStorage(
        'list'
      )


    const files =
      Array.isArray(data.files)
        ? data.files
        : []


    if(!files.length){

      filesEl.innerHTML =
        '<div class="empty">No files uploaded yet.</div>'

      setStatus('')

      return

    }


    filesEl.innerHTML = ''


    for(const file of files){

      const row =
        document.createElement('div')

      row.className =
        'file'


      const icon =
        document.createElement('div')

      icon.textContent =
        '📄'


      const content =
        document.createElement('div')

      content.className =
        'grow'


      const name =
        document.createElement('div')

      name.className =
        'name'

      name.textContent =
        file.name ||
        'Unnamed file'


      const meta =
        document.createElement('div')

      meta.className =
        'meta'


      if(file.metadata?.size){

        meta.textContent =
          formatBytes(
            Number(file.metadata.size)
          )

      }


      if(file.created_at){

        meta.textContent +=
          (
            meta.textContent
              ? ' • '
              : ''
          ) +
          new Date(
            file.created_at
          ).toLocaleString()

      }


      content.appendChild(
        name
      )

      content.appendChild(
        meta
      )


      const actions =
        document.createElement('div')

      actions.className =
        'actions'


      const view =
        document.createElement('button')

      view.className =
        'btn alt'

      view.textContent =
        'View'


      view.onclick =
        () => viewFile(file.name)


      const del =
        document.createElement('button')

      del.className =
        'btn alt danger'

      del.textContent =
        'Delete'


      del.onclick =
        () => deleteFile(file.name)


      actions.appendChild(
        view
      )

      actions.appendChild(
        del
      )


      row.appendChild(
        icon
      )

      row.appendChild(
        content
      )

      row.appendChild(
        actions
      )


      filesEl.appendChild(
        row
      )

    }


    setStatus('')

  }catch(error){

    console.error(
      'List error:',
      error
    )


    filesEl.innerHTML =
      '<div class="empty">' +
      escapeHtml(
        error instanceof Error
          ? error.message
          : 'Unable to load files'
      ) +
      '</div>'

  }

}


/* =========================
   VIEW FILE
========================= */

async function viewFile(name){

  try{

    setStatus(
      'Creating secure link…'
    )


    const data =
      await callStorage(
        'signed',
        null,
        'notes/' + name
      )


    if(!data.url){

      throw new Error(
        'No secure URL returned'
      )

    }


    window.open(
      data.url,
      '_blank',
      'noopener'
    )


    setStatus(
      'Secure link created. It expires in 10 minutes.'
    )

  }catch(error){

    console.error(
      'View error:',
      error
    )


    setStatus(
      '❌ ' +
      (
        error instanceof Error
          ? error.message
          : 'Unable to open PDF'
      )
    )

  }

}


/* =========================
   DELETE FILE
========================= */

async function deleteFile(name){

  if(
    !confirm(
      'Delete ' + name + '?'
    )
  ){

    return

  }


  try{

    setStatus(
      'Deleting…'
    )


    await callStorage(
      'delete',
      null,
      'notes/' + name
    )


    setStatus(
      'Deleted.'
    )


    await loadFiles()

  }catch(error){

    console.error(
      'Delete error:',
      error
    )


    setStatus(
      '❌ ' +
      (
        error instanceof Error
          ? error.message
          : 'Delete failed'
      )
    )

  }

}


/* =========================
   HELPERS
========================= */

function formatBytes(bytes){

  if(!bytes){
    return ''
  }


  const units =
    ['B','KB','MB','GB']


  let i = 0


  let value =
    Number(bytes)


  while(
    value >= 1024 &&
    i < units.length - 1
  ){

    value /= 1024

    i++

  }


  return (
    value.toFixed(
      i ? 1 : 0
    ) +
    ' ' +
    units[i]
  )

}


function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      })[character]
    )

}


/* =========================
   GLOBAL BUTTONS
========================= */

window.openPanel =
  openPanel

window.closePanel =
  closePanel

window.uploadFile =
  uploadFile

window.loadFiles =
  loadFiles

window.viewFile =
  viewFile

window.deleteFile =
  deleteFile

launch.onclick =
  openPanel

</script>

</body>
  </html>
