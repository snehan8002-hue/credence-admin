<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE — Profile & Settings</title><style>:root{--g:#08783f;--ink:#123126;--muted:#66756e;--bg:#f5f8f6;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 6%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--g);letter-spacing:2px;font-size:24px}.wrap{max-width:820px;margin:auto;padding:30px 6%}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:750;font-size:13px}.field input{padding:13px;border:1px solid #d5e1db;border-radius:11px;font:inherit;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn,button{border:0;border-radius:11px;padding:11px 15px;background:var(--g);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#e7f2ec;color:var(--g)}.notice{padding:11px 13px;border-radius:11px;background:#fff3cd;color:#705b12;margin:12px 0}.success{background:#e1f3e9;color:var(--g)}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:24px 4%}}</style></head><body><header><div class="brand">CREDENCE</div><a class="btn secondary" href="index.html#dashboard">Back to learning</a></header><main class="wrap"><h1>Profile & Settings</h1><p class="muted">Manage your student information and notification preferences.</p><div id="notice" class="notice">Loading your profile…</div><form id="form" class="card"><div class="grid"><div class="field"><label>Full name</label><input id="name" required maxlength="120"></div><div class="field"><label>Username</label><input id="username" maxlength="50" placeholder="Optional"></div></div><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" disabled></div><div class="field"><label>Phone</label><input id="phone" inputmode="tel" maxlength="30" placeholder="Optional"></div></div><div class="field"><label>Avatar URL</label><input id="avatar" type="url" maxlength="500" placeholder="Optional image URL"></div><h3>Notifications</h3><label class="row"><span>Email notifications</span><input id="emailPref" type="checkbox"></label><label class="row"><span>Course announcements</span><input id="announcePref" type="checkbox"></label><button type="submit" style="margin-top:18px">Save changes</button></form><div class="card"><h3>Account</h3><div class="row"><span class="muted">Member since</span><b id="joined">—</b></div><div class="row"><span class="muted">Account role</span><b>Student</b></div></div></main><script>const U='https://tasoycsbzceohgjxizdp.supabase.co',K='sb_publishable_ZLU-d0ZI-XT_IgabzmigkA_5vohKjLl',$=id=>document.getElementById(id);function session(){try{return JSON.parse(localStorage.getItem('credence_session')||'null')}catch{return null}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const s=session();if(!s?.access_token)throw Error('Please log in first.');const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error('Profile request failed');return r.status===204?null:r.json()}async function load(){try{const s=session();if(!s?.user?.id)throw Error('Please log in as a student.');const p=(await api('profiles?id=eq.'+encodeURIComponent(s.user.id)+'&select=id,username,full_name,email,phone,avatar_url,preferences,created_at&limit=1'))[0]||{};$('name').value=p.full_name||'';$('username').value=p.username||'';$('email').value=p.email||s.user.email||'';$('phone').value=p.phone||'';$('avatar').value=p.avatar_url||'';const pref=p.preferences&&typeof p.preferences==='object'?p.preferences:{};$('emailPref').checked=pref.email_notifications!==false;$('announcePref').checked=pref.announcements!==false;$('joined').textContent=p.created_at?new Date(p.created_at).toLocaleDateString('en-IN'):'—';$('notice').textContent='Profile loaded.';$('notice').className='notice success'}catch(e){$('notice').textContent=e.message}}$('form').onsubmit=async e=>{e.preventDefault();try{const s=session();const preferences={email_notifications:$('emailPref').checked,announcements:$('announcePref').checked};await api('profiles?id=eq.'+encodeURIComponent(s.user.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({full_name:$('name').value.trim(),username:$('username').value.trim()||null,phone:$('phone').value.trim()||null,avatar_url:$('avatar').value.trim()||null,preferences})});$('notice').textContent='Profile saved successfully.';$('notice').className='notice success'}catch(e){$('notice').textContent=e.message;$('notice').className='notice'}};load();</script></body></html>
