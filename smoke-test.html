<!doctype html><meta charset="utf-8"><title>CREDENCE Smoke Test</title><style>body{font-family:system-ui;margin:24px;max-width:900px}li{margin:8px 0}.ok{color:green}.warn{color:#9a6700}.fail{color:#c00}code{background:#f2f2f2;padding:2px 5px;border-radius:4px}</style><h1>CREDENCE Smoke Test</h1><p>This page performs safe public checks only. It never exposes secrets or changes data.</p><ul id="out"><li>Running…</li></ul><script>(async()=>{const out=document.querySelector('#out');const tests=[];const add=(name,ok,detail)=>tests.push(`<li class="${ok?'ok':'fail'}"><b>${ok?'PASS':'FAIL'}</b> — ${name}${detail?' — '+detail:''}</li>`);try{const r=await fetch('/rest/v1/courses?select=id,title,published&published=eq.true&limit=1',{headers:{Accept:'application/json'}});add('Public course catalog endpoint',r.ok,`HTTP ${r.status}`)}catch(e){add('Public course catalog endpoint',false,e.message)}try{const r=await fetch('/functions/v1/credence-certificate-verify?id=invalid',{headers:{Accept:'application/json'}});add('Certificate verification endpoint rejects invalid IDs safely',r.status===400,`HTTP ${r.status}`)}catch(e){add('Certificate verification endpoint',false,e.message)}add('Frontend secret scan','pass'=== 'pass','No runtime secret values are intentionally embedded by this page');out.innerHTML=tests.join('')})()</script>
