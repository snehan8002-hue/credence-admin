<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify CREDENCE Certificate</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f8f5;color:#123126;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(620px,100%);background:#fff;border:1px solid #dfe9e3;border-radius:24px;padding:34px;box-shadow:0 20px 60px #12312612;text-align:center}.brand{font-weight:900;letter-spacing:4px;color:#08783f;font-size:27px}.tag{display:inline-block;margin:25px 0 8px;padding:7px 12px;border-radius:99px;background:#e1f3e9;color:#08783f;font-weight:800;font-size:12px}.sub{color:#66756e}.form{display:flex;gap:10px;margin:28px 0}.form input{flex:1;padding:14px;border:1px solid #ccdcd3;border-radius:12px;font:inherit}.form button{border:0;border-radius:12px;padding:14px 20px;background:#08783f;color:#fff;font-weight:800}.result{display:none;text-align:left;padding:22px;border-radius:18px}.valid{background:#eaf7ef;border:1px solid #bfe3cc}.invalid{background:#fff1f1;border:1px solid #f0c8c8}.check{font-size:34px}.label{font-size:12px;color:#66756e}.value{font-weight:800;font-size:19px;margin:4px 0 16px}.footer{margin-top:25px;font-size:12px;color:#84928c}@media(max-width:560px){.form{flex-direction:column}.box{padding:25px}}</style></head><body><main class="box"><div class="brand">CREDENCE</div><span class="tag">CERTIFICATE VERIFICATION</span><h1>Verify a Certificate</h1><p class="sub">Enter the certificate ID to verify that a CREDENCE completion certificate is authentic.</p><form id="form" class="form"><input id="id" autocomplete="off" placeholder="e.g. CRD-2026-XXXXXXXXXXXX" required><button>Verify</button></form><section id="result" class="result"></section><div class="footer">CREDENCE • Official certificate verification</div></main><script>const ENDPOINT='https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/credence-verify-certificate';const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function verify(id){const box=$('result');box.style.display='block';box.className='result';box.innerHTML='<div>Checking certificate…</div>';try{const r=await fetch(ENDPOINT+'?certificate_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.valid){box.className='result invalid';box.innerHTML='<div class="check">✕</div><h2>Certificate not found</h2><p class="sub">No authentic CREDENCE certificate matches this ID. Please check the ID and try again.</p>';return}const c=d.certificate;box.className='result valid';box.innerHTML='<div class="check">✓</div><h2>Certificate Verified</h2><p class="label">Student</p><div class="value">'+esc(c.student_name)+'</div><p class="label">Course</p><div class="value">'+esc(c.course_title)+'</div><p class="label">Issued</p><div class="value">'+new Date(c.issue_date).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})+'</div><p class="label">Certificate ID</p><div class="value">'+esc(c.certificate_id)+'</div>'}catch(e){box.className='result invalid';box.innerHTML='<div class="check">!</div><h2>Verification unavailable</h2><p class="sub">Please try again in a moment.</p>'}}$('form').onsubmit=e=>{e.preventDefault();verify($('id').value.trim())};const q=new URLSearchParams(location.search).get('id');if(q){$('id').value=q;verify(q)}</script></body></html>
