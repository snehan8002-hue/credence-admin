<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CREDENCE • Secure Storage</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f4f8f5;color:#17352a}.wrap{max-width:1050px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #dfe9e3;border-radius:22px;padding:22px}.login{max-width:430px;margin:70px auto}.input{width:100%;padding:12px;border:1px solid #dfe9e3;border-radius:11px;box-sizing:border-box;margin:6px 0 12px}.btn{border:0;border-radius:11px;padding:12px 16px;background:#08783f;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:14px;padding:11px;background:#f2f6f3;border-radius:11px;font-size:12px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.file{display:flex;gap:12px;padding:12px;border:1px solid #dfe9e3;border-radius:13px;margin-top:9px}.grow{flex:1}.small{font-size:12px;color:#718078}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>CREDENCE Secure Storage</h1><p class="small">Administrator access • Private PDF vault</p><label>Admin email</label><input id="email" class="input" type="email" autocomplete="username"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">Sign in securely</button><div id="loginStatus" class="status"></div></div></div><div id="app" class="wrap hidden"><div class="card"><h1>CREDENCE Secure Storage</h1><p class="small">Private document vault • PDF only • 50 MB maximum</p><div class="grid"><section><h2>Upload document</h2><input id="file" type="file" accept="application/pdf,.pdf"><div class="actions"><button id="uploadBtn" class="btn">Upload PDF</button><button id="healthBtn" class="btn">System check</button><button id="logoutBtn" class="btn">Sign out</button></div><div id="status" class="status">Ready.</div><pre id="diag" class="status hidden"></pre></section><section><h2>Stored documents</h2><button id="refreshBtn" class="btn">Refresh</button><div id="files"><div class="small">Waiting for secure connection…</div></div></section></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,getIdToken}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const cfg={apiKey:'AIzaSyCka8C2otBgwXwT2Qtg5bZcPG3J_84Wgs8',authDomain:'credence-76953.firebaseapp.com',projectId:'credence-76953',storageBucket:'credence-76953.firebasestorage.app',messagingSenderId:'973979489973',appId:'1:973979489973:web:ac260b237071f7007050fc'};const UID='aBYdbFwbsTUbpmYtoNurxyu3Roj2';const FN='https://tasoycsbzceohgjxizdp.supabase.co/functions/v1/super-handler';const auth=getAuth(initializeApp(cfg));let user=null,loading=false;const $=id=>document.getElementById(id);const st=(x,b=false)=>{$('status').textContent=x;$('status').style.color=b?'#b52d2d':''};const wait=ms=>new Promise(r=>setTimeout(r,ms));function makeBody(action,token,file,path){if(file){const b=new FormData();b.append('firebaseToken',token);b.append('action',action);b.append('file',file);return b}const b=new URLSearchParams();b.set('firebaseToken',token);b.set('action',action);if(path)b.set('path',path);return b}async function req(action,file=null,path=null){if(!user||user.uid!==UID)throw Error('Authorized CREDENCE admin session required.');const token=await getIdToken(user,true);let last;for(let attempt=0;attempt<3;attempt++){try{const body=makeBody(action,token,file,path);const r=await fetch(FN,{method:'POST',mode:'cors',credentials:'omit',cache:'no-store',body});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error('Supabase '+r.status+': '+(d.error||raw||'Request failed'));if(!d.success)throw Error(d.error||'Storage request failed');return d}catch(e){last=e;if(attempt<2)await wait(700*(attempt+1))}}throw Error('Browser could not complete the cross-origin request: '+(last?.message||'Failed to fetch'))}function renderFiles(a){const box=$('files');box.innerHTML='';if(!a.length){box.innerHTML='<div class="small">No documents uploaded yet.</div>';return}for(const x of a){const row=document.createElement('div');row.className='file';row.innerHTML='<div>📕</div><div class="grow"><b class="name"></b><div class="small"></div></div><button class="btn view">View</button><button class="btn del">Delete</button>';row.querySelector('.name').textContent=x.name;row.querySelector('.small').textContent=x.created_at?new Date(x.created_at).toLocaleString():'';row.querySelector('.view').onclick=async()=>{try{location.href=(await req('signed',null,'notes/'+x.name)).url}catch(e){st('❌ '+e.message,true)}};row.querySelector('.del').onclick=async()=>{if(confirm('Delete '+x.name+'?')){try{await req('delete',null,'notes/'+x.name);await load()}catch(e){st('❌ '+e.message,true)}}};box.append(row)}}async function load(){if(loading)return;loading=true;st('Loading stored documents…');try{const d=await req('list');renderFiles(d.files||[]);st((d.files||[]).length?'Documents loaded.':'No documents uploaded yet.')}catch(e){st('❌ '+e.message,true)}finally{loading=false}}async function health(){const diag=$('diag');diag.classList.remove('hidden');try{const d=await req('list');const a=d.files||[];renderFiles(a);diag.textContent='Authenticated POST OK\n'+JSON.stringify({success:d.success,fileCount:a.length},null,2);st(a.length?'Documents loaded.':'No documents uploaded yet.')}catch(e){diag.textContent='Storage POST failed: '+e.message;st('❌ '+e.message,true)}}$('loginBtn').onclick=async()=>{const e=$('email').value.trim(),p=$('password').value;if(!e||!p)return $('loginStatus').textContent='Enter admin email and password.';$('loginBtn').disabled=true;$('loginStatus').textContent='Signing in…';try{await signInWithEmailAndPassword(auth,e,p)}catch(x){$('loginStatus').textContent=(x?.code||'Login error')+': '+(x?.message||'Unable to sign in.')}finally{$('loginBtn').disabled=false}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('uploadBtn').onclick=async()=>{const f=$('file').files[0];if(!f)return st('Choose a PDF first.',true);if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return st('Only PDF files are allowed.',true);if(f.size>52428800)return st('Maximum file size is 50 MB.',true);$('uploadBtn').disabled=true;st('Uploading securely…');try{const d=await req('upload',f);st('✅ Uploaded successfully: '+d.fileName);$('file').value='';await load()}catch(e){st('❌ '+e.message,true);await health()}finally{$('uploadBtn').disabled=false}};$('refreshBtn').onclick=load;$('healthBtn').onclick=health;$('logoutBtn').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(u&&u.uid===UID){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');await wait(500);await health()}else{user=null;$('login').classList.remove('hidden');$('app').classList.add('hidden');if(u)signOut(auth)}});</script></body></html>
